function applyTheme(theme) {
  if (theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
  else document.documentElement.removeAttribute("data-theme");
  window.localStorage.setItem("theme", theme);
  document.querySelectorAll("#themeToggle button").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.themeChoice === theme);
  });
}
document.querySelectorAll("#themeToggle button").forEach(btn => {
  btn.onclick = () => applyTheme(btn.dataset.themeChoice);
});
applyTheme(window.localStorage.getItem("theme") === "dark" ? "dark" : "light");

// ============================================================
// FIREBASE — ВХОД И ХРАНЕНИЕ ЗАДАЧ/ПЛАНИРОВАНИЯ
// ============================================================
// Конфигурация Firebase-проекта WorkSpace - это публичный идентификатор
// проекта (не секрет, как GOOGLE_SERVICE_ACCOUNT_KEY), поэтому его можно
// безопасно хранить прямо в коде. Реальная защита данных - в правилах
// безопасности Firestore (firestore.rules), а не в сокрытии этого объекта.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAtkUkdbUAV87jYQ-RML9R3soghpEl6GUU",
  authDomain: "workspace-ursi.firebaseapp.com",
  projectId: "workspace-ursi",
  storageBucket: "workspace-ursi.firebasestorage.app",
  messagingSenderId: "878290426896",
  appId: "1:878290426896:web:785903ceaed24d688b7e95",
};
let firebaseConfig = FIREBASE_CONFIG;
let fbApp = null, fbAuth = null, fbDb = null;

function initFirebase() {
  if (!firebaseConfig || fbApp) return;
  fbApp = firebase.initializeApp(firebaseConfig);
  fbAuth = firebase.auth();
  fbDb = firebase.firestore();
}

/**
 * Из консоли Firebase обычно копируется НЕ строгий JSON, а фрагмент кода
 * вида:
 *   const firebaseConfig = {
 *     apiKey: "...",
 *     authDomain: "...",
 *     ...
 *   };
 * (ключи без кавычек, есть "const ... =" в начале и ";" в конце) - строгий
 * JSON.parse на таком тексте падает. Эта функция сначала пробует честный
 * JSON.parse (вдруг вставили именно JSON), а если не вышло - вырезает
 * фигурные скобки объекта и безопасно вычисляет его как JS-объект (это
 * данные, которые пользователь сам вставил в свой же браузер, а не код
 * с чужого сайта - поэтому такое вычисление здесь уместно и безопасно).
 */
function parseFirebaseConfigInput(raw) {
  try {
    return JSON.parse(raw);
  } catch (e) {
    // не строгий JSON - пробуем как фрагмент JS-кода
  }
  const start = raw.indexOf("{");
  const end = raw.lastIndexOf("}");
  if (start === -1 || end === -1 || end < start) {
    throw new Error("Не найдены фигурные скобки объекта конфигурации.");
  }
  const objectLiteral = raw.slice(start, end + 1);
  const value = new Function("return (" + objectLiteral + ");")();
  if (!value || typeof value !== "object" || !value.apiKey) {
    throw new Error("Похоже, это не конфигурация Firebase (нет поля apiKey).");
  }
  return value;
}

// Firebase Auth требует email - у нас же принято работать с простыми
// логинами (напр. "admin"), поэтому логин без "@" превращаем в
// псевдо-почту вида "admin@workspace.local" - это стандартный, безопасный
// приём, реальная почта коллегам не нужна.
function loginToEmail(login) {
  const trimmed = String(login).trim();
  return trimmed.includes("@") ? trimmed : `${trimmed}@workspace.local`;
}

let currentUser = null; // { uid, username, role, allowedSubsidies, allowedPages }

function pageAllowed(page) {
  if (!currentUser) return false;
  if (currentUser.allowedPages === "all") return true;
  return currentUser.allowedPages.split(",").map(s => s.trim()).includes(page);
}
function subsidyAllowedForUser(subsidyId) {
  if (!currentUser) return false;
  if (currentUser.allowedSubsidies === "all") return true;
  return currentUser.allowedSubsidies.split(",").map(s => s.trim()).includes(subsidyId);
}
function visibleSubsidiesForUser() {
  return subsidies.filter(s => subsidyAllowedForUser(s.id));
}

function renderLoginScreen() {
  const loginEl = document.getElementById("loginScreen");
  document.getElementById("appContainer").style.display = "none";
  loginEl.style.display = "block";

  initFirebase();

  loginEl.innerHTML = `
    <div class="card">
      <h2>Вход в WorkSpace</h2>
      <label>Логин</label>
      <input type="text" id="loginUsername">
      <label>Пароль</label>
      <input type="password" id="loginPassword">
      <button class="btn btn-primary" style="margin-top:14px;width:100%" id="loginSubmitBtn">Войти</button>
      <div id="loginStatus" style="margin-top:10px;font-size:13px"></div>
    </div>`;

  document.getElementById("loginSubmitBtn").onclick = handleLogin;
  document.getElementById("loginPassword").onkeydown = (e) => { if (e.key === "Enter") handleLogin(); };
}

async function handleLogin() {
  const typedUsername = document.getElementById("loginUsername").value.trim();
  const password = document.getElementById("loginPassword").value;
  const statusEl = document.getElementById("loginStatus");
  if (!typedUsername || !password) { statusEl.textContent = "Впишите логин и пароль."; return; }

  statusEl.textContent = "Проверяю...";
  try {
    const cred = await fbAuth.signInWithEmailAndPassword(loginToEmail(typedUsername), password);
    const profileSnap = await fbDb.collection("users").doc(cred.user.uid).get();
    if (!profileSnap.exists) {
      statusEl.textContent = "❌ Учётная запись есть, но нет профиля с правами доступа. Обратитесь к администратору.";
      await fbAuth.signOut();
      return;
    }
    const profile = profileSnap.data();
    // ВАЖНО: логин определяем из РЕАЛЬНОЙ почты аккаунта (cred.user.email),
    // а не из того, что человек ввёл в поле - иначе при входе с другим
    // регистром букв (напр. "Admin" вместо "admin") currentUser.username
    // получался бы РАЗНЫМ в разных сессиях, и задачи, назначенные "на
    // себя", переставали бы совпадать при сравнении на другом устройстве.
    const username = cred.user.email.endsWith("@workspace.local") ? cred.user.email.replace("@workspace.local", "") : cred.user.email;
    currentUser = { uid: cred.user.uid, username, role: profile.role || "user", allowedSubsidies: profile.allowedSubsidies || "all", allowedPages: profile.allowedPages || "all" };
    showApp();
  } catch (err) {
    statusEl.textContent = "❌ Неверный логин или пароль.";
  }
}

function handleLogout() {
  stopRealtimeSync();
  if (fbAuth) fbAuth.signOut();
  currentUser = null;
  tasksLoaded = false; // при следующем входе загрузка и синхронизация начнутся заново
  renderLoginScreen();
}

async function showApp() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("appContainer").style.display = "flex";

  if (!subsidiesLoadedFromFirestore) await loadSubsidiesFromFirestore();

  // Скрываем в меню разделы, недоступные текущему пользователю; если
  // текущая страница вдруг недоступна - переключаемся на первую доступную.
  document.querySelectorAll(".nav-item[data-page]").forEach(el => {
    const allowed = pageAllowed(el.dataset.page);
    el.style.display = allowed ? "" : "none";
  });
  if (!pageAllowed(currentPage)) {
    const firstAllowed = ["dashboard", "generator", "smeta", "planning", "documents", "settings"].find(pageAllowed);
    currentPage = firstAllowed || "generator";
  }

  // На момент первой инициализации smetaState/planningSelectedSubsidyId
  // currentUser ещё не был известен, поэтому дефолтная субсидия могла
  // выбраться без учёта прав - пересчитываем её здесь, когда права уже известны.
  const visible = visibleSubsidiesForUser();
  if (!visible.some(s => s.id === smetaState.selectedSubsidyId)) {
    smetaState.selectedSubsidyId = visible[0] ? visible[0].id : null;
    smetaState.selectedProjectId = null;
  }
  if (!visible.some(s => s.id === planningSelectedSubsidyId)) {
    planningSelectedSubsidyId = visible[0] ? visible[0].id : null;
    planningSelectedProjectId = null;
  }
  if (!subsidyAllowedForUser(state.grantId)) {
    const firstAllowedGrant = Object.keys(GRANTS).find(subsidyAllowedForUser);
    if (firstAllowedGrant) state.grantId = firstAllowedGrant;
  }

  document.getElementById("logoutNavItem").onclick = handleLogout;
  document.getElementById("pageSubtitle").textContent = PAGE_SUBTITLES[currentPage] || PAGE_SUBTITLES.generator;
  renderSidebar();
  renderStepsNav();
  renderApp();
}

// Стартовая точка: Firebase сам помнит вход между перезагрузками страницы
// (onAuthStateChanged восстанавливает сессию автоматически).
initFirebase();
fbAuth.onAuthStateChanged(async (user) => {
  if (user && !currentUser) {
    const profileSnap = await fbDb.collection("users").doc(user.uid).get();
    if (profileSnap.exists) {
      const profile = profileSnap.data();
      const username = user.email.endsWith("@workspace.local") ? user.email.replace("@workspace.local", "") : user.email;
      currentUser = { uid: user.uid, username, role: profile.role || "user", allowedSubsidies: profile.allowedSubsidies || "all", allowedPages: profile.allowedPages || "all" };
      showApp();
      return;
    }
  }
  if (!user) renderLoginScreen();
});

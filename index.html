  h3 { font-size: 14px; margin: 20px 0 10px; color: #444; }

  .btn-primary { background: #dc2626; color: white; }

  .btn-secondary { background: #f0f0f0; color: #333; }
  .btn-small { padding: 6px 12px; font-size: 12px; }
  .btn-danger-text { background: none; color: #dc2626; font-size: 13px; padding: 4px 8px; border: none; cursor: pointer; }

  .contractor-card.selected { border-color: #dc2626; background: #fef2f2; }

  table.row-table th { background: #f5f5f5; font-weight: 600; }
  table.row-table input { border: none; padding: 4px; font-size: 12px; width: 100%; }
  .appendix-block { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; background: #fcfcfc; }

  .error { background: #fef2f2; border: 1px solid #ef4444; }

  .checkbox-row label { margin: 0; font-weight: normal; }
  .review-table { width: 100%; font-size: 13px; border-collapse: collapse; }
  .review-table td { padding: 5px 8px; border-bottom: 1px solid #eee; vertical-align: top; }
  .review-table td:first-child { color: #666; width: 220px; }
  .field-error { border-color: #dc2626 !important; background: #fef2f2 !important; }

function buildActingBasis(contractorVariant, contractor) {
  if (contractorVariant === "ip" || contractorVariant === "ip_ads") return `действующий на основании ОГРНИП ${contractor.contractor_ogrnip || ""} от ${contractor.contractor_ogrn_date || ""}`;
  if (contractorVariant === "ooo") return "действующего на основании устава";
  return undefined;
}

function buildPayload(state, config, grant) {
  if (!state.notEmployeeConfirmed) throw new Error("Не подтверждено: контрагент не является сотрудником/студентом СПбГУПТД.");
  const customer = getCustomer(grant.customer);
  const data = {
    contract_number: state.contractNumber, contract_date: state.contractDate, polozhenie_clause: state.polozhenieClause,
    grant_agreement_number: grant.grant_agreement_number, grant_agreement_date: grant.grant_agreement_date, grantor_name: grant.grantor_name, igk: grant.igk,
    customer_short_name: customer.short_name, customer_full_name: customer.full_name,
    customer_req_full_name: customer.req_full_name, customer_req_full_name_guillemet: customer.req_full_name_guillemet,
    customer_signatory_clause: customer.signatory_clause, customer_address: customer.address, customer_inn_kpp: customer.inn_kpp,
    customer_bank_authority: customer.bank_authority, customer_eks: customer.eks, customer_ks: customer.ks, customer_bik: customer.bik,
    customer_personal_account: customer.personal_account, customer_signatory_position_short: customer.signatory_position_short,
    customer_signatory_initials: customer.signatory_initials, customer_signatory_initials_reversed: customer.signatory_initials_reversed,
    vat_clause: state.vatClause || "НДС не облагается", payment_term_days: state.paymentTermDays || "7", payment_term_days_words: state.paymentTermDaysWords || "Семи",
  };
  Object.assign(data, state.contractor);
  const actingBasis = buildActingBasis(state.contractorVariant, state.contractor);
  if (actingBasis) data.contractor_acting_basis = actingBasis;
  for (const field of config.bodyFields) data[field] = state.bodyValues[field];
  // Сумма договора - всегда авто-считается из строк приложений/аренды (см. computeContractTotalRub), не вводится вручную
  data.total_amount_rub = computeContractTotalRub(state, config);
  const appendicesForLoop = [];
  state.appendices.forEach((appendix, idx) => {
    const n = idx + 1;
    appendicesForLoop.push({ appendix_number: String(n), project_solution_name: appendix.values.project_solution_name, subject_description_short: state.bodyValues.subject_description_short, goods_description_short: appendix.values.goods_description_short });
    if (n === 1) { data.appendix1_number = "1"; }
    for (const field of config.appendixFields) {
      const finalKey = config.appendixCount > 1 ? `appendix${n}_${field}` : (field === "project_solution_name" ? "project_solution_name" : `appendix_${field}`);
      data[finalKey] = appendix.values[field];
    }
    const appendixTotal = computeAppendixTotalRub(appendix, config);
    if (config.appendixTotalPattern === "appendixN_total") data[`appendix${n}_total_rub`] = appendixTotal;
    else if (config.appendixTotalPattern === "appendix_total") data.appendix_total_rub = appendixTotal;
    data[config.loopNames[idx]] = appendix.rows;
  });
  data.appendices = appendicesForLoop;
  if (state.rental) {
    const dailyTotal = computeRentalDailyTotalRub(state, config);
    const days = parseInt(state.rental.days) || 1;
    data.rental_start_date = state.rental.startDate;
    data.rental_end_date = state.rental.endDate;
    data.rental_daily_total_rub = dailyTotal;
    data.rental_total_rub = dailyTotal * days;
  }
  return { contractType: state.contractType, contractorVariant: state.contractorVariant, fileName: `Договор_${state.contractNumber}.docx`, data, sheetsWriteBack: state.sheetsWriteBack || undefined };
}

// ============================================================
// АВТОСЧЁТ СУММ — количество × цена = сумма строки, сумма приложения =
// сумма всех строк, сумма договора = сумма всех приложений (или аренды).
// ============================================================
function parseRuNumber(str) {
  if (str === undefined || str === null || str === "") return 0;
  const cleaned = String(str).replace(/\s/g, "").replace(",", ".").replace(/[^\d.-]/g, "");
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}
function formatRuNumber(n) {
  if (!isFinite(n)) n = 0;
  const fixed = n.toFixed(2);
  const [intPart, decPart] = fixed.split(".");
  const withSpaces = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return `${withSpaces},${decPart}`;
}
function computeRowTotal(row, config) {
  const qty = parseRuNumber(row[config.calcFields.qty]);
  const price = parseRuNumber(row[config.calcFields.price]);
  return qty * price;
}
function computeAppendixTotalRub(appendix, config) {
  return appendix.rows.reduce((sum, row) => sum + computeRowTotal(row, config), 0);
}
function computeContractTotalRub(state, config) {
  if (state.contractType === "rental_400") {
    const dailyTotal = computeRentalDailyTotalRub(state, config);
    const days = parseInt(state.rental && state.rental.days) || 1;
    return dailyTotal * days;
  }
  return state.appendices.reduce((sum, a) => sum + computeAppendixTotalRub(a, config), 0);
}
function computeRentalDailyTotalRub(state, config) {
  if (!state.appendices[0]) return 0;
  return computeAppendixTotalRub(state.appendices[0], config);
}

function recalcRowLive(aIdx) {
  const config = currentConfig();
  document.querySelectorAll(`[data-a="${aIdx}"]`).forEach(inp => {
    const r = parseInt(inp.dataset.r), f = inp.dataset.f;
    if (f !== config.calcFields.total) state.appendices[aIdx].rows[r][f] = inp.value;
  });
  state.appendices[aIdx].rows.forEach((row, rIdx) => {
    const total = computeRowTotal(row, config);
    row[config.calcFields.total] = formatRuNumber(total);
    const totalInput = document.querySelector(`[data-a="${aIdx}"][data-r="${rIdx}"][data-f="${config.calcFields.total}"]`);
    if (totalInput) totalInput.value = formatRuNumber(total);
  });
  const totalDisplay = document.getElementById(`appendixTotalDisplay-${aIdx}`);
  if (totalDisplay) totalDisplay.textContent = formatRuNumber(computeAppendixTotalRub(state.appendices[aIdx], config)) + " руб.";
  if (state.contractType === "rental_400") recalcRentalLive();
}

function recalcRentalLive() {
  const config = currentConfig();
  const daysEl = document.getElementById("rentalDays");
  const days = daysEl ? (parseInt(daysEl.value) || 1) : 1;
  if (!state.rental) state.rental = {};
  state.rental.days = days;
  const dailyTotal = computeRentalDailyTotalRub(state, config);
  const dailyDisplay = document.getElementById("rentalDailyDisplay");
  const totalDisplay = document.getElementById("rentalTotalDisplay");
  if (dailyDisplay) dailyDisplay.textContent = formatRuNumber(dailyTotal) + " руб.";
  if (totalDisplay) totalDisplay.textContent = formatRuNumber(dailyTotal * days) + " руб.";
}

function showValidationMessage(text) {
  let msgBox = document.getElementById("validationMsg");

    msgBox = document.createElement("div");

    msgBox.className = "warning-box";
    msgBox.style.marginBottom = "12px";
    document.getElementById("app").prepend(msgBox);

}

  if (msgBox) msgBox.remove();
}
function validateCurrentStep() {
  const invalids = [];
  document.querySelectorAll("#app [required]").forEach(el => {
    el.classList.remove("field-error");
    const isEmpty = el.type === "checkbox" ? !el.checked : !el.value || !el.value.trim();
    if (isEmpty) { el.classList.add("field-error"); invalids.push(el); }
  });
  if (invalids.length > 0) {
    invalids[0].scrollIntoView({ behavior: "smooth", block: "center" });
    invalids[0].focus();
    showValidationMessage(`Заполните обязательные поля (отмечены красным) — их ${invalids.length}.`);
    return false;
  }
  clearValidationMessage();
  return true;
}

function ensureAppendices() {

function extractSpreadsheetId(urlOrId) {
  if (!urlOrId) return "";
  const match = urlOrId.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
  return match ? match[1] : urlOrId.trim();
}

async function handleCreateUser() {
  const statusEl = document.getElementById("createUserStatus");
  const username = document.getElementById("newUserUsername").value.trim();
  const password = document.getElementById("newUserPassword").value;
  const role = document.getElementById("newUserRole").value;
  if (!username || !password) { statusEl.textContent = "⚠️ Впишите логин и пароль."; return; }
  if (password.length < 6) { statusEl.textContent = "⚠️ Пароль должен быть не короче 6 символов (требование Firebase)."; return; }

  let allowedSubsidies = "all";
  if (!document.getElementById("newUserAllSubsidies").checked) {
    const checked = [...document.querySelectorAll("[data-new-user-subsidy]:checked")].map(el => el.dataset.newUserSubsidy);
    allowedSubsidies = checked.join(",") || "all";
  }
  let allowedPages = "all";
  if (!document.getElementById("newUserAllPages").checked) {
    const checked = [...document.querySelectorAll("[data-new-user-page]:checked")].map(el => el.dataset.newUserPage);
    allowedPages = checked.join(",") || "all";
  }

  statusEl.textContent = "Создаю...";
  // Создаём пользователя через ВТОРОЙ (временный) экземпляр Firebase-приложения -
  // иначе создание нового аккаунта автоматически переключило бы сессию
  // браузера на этот новый аккаунт и выкинуло бы администратора из системы.
  const secondaryApp = firebase.initializeApp(firebaseConfig, "secondary-" + Date.now());
  try {
    const cred = await secondaryApp.auth().createUserWithEmailAndPassword(loginToEmail(username), password);
    await fbDb.collection("users").doc(cred.user.uid).set({
      username, role, allowedSubsidies, allowedPages, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    await secondaryApp.auth().signOut();
    await secondaryApp.delete();
    statusEl.textContent = "✅ Пользователь создан. Сообщите коллеге логин и пароль.";
    document.getElementById("newUserUsername").value = "";
    document.getElementById("newUserPassword").value = "";
  } catch (err) {
    await secondaryApp.delete();
    if (err.code === "auth/email-already-in-use") {
      statusEl.textContent = "❌ Пользователь с таким логином уже существует.";
    } else {
      statusEl.textContent = "❌ " + err.message;
    }
  }
}

async function handleDiscoverProjects(subsidyId) {
  const s = findSubsidy(subsidyId);
  const statusEl = document.getElementById(`discoverStatus_${subsidyId}`);
  if (!s.spreadsheetUrl) { statusEl.textContent = "⚠️ Сначала вставьте ссылку на таблицу."; return; }
  if (!s.hiddenSheetNames) s.hiddenSheetNames = [];

  statusEl.textContent = "Ищу листы в таблице...";
  try {
    const res = await fetch(`${window.location.origin}/.netlify/functions/list-sheet-tabs`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ spreadsheetUrlOrId: s.spreadsheetUrl }),
    });
    const json = await res.json();
    if (res.ok && json.success) {
      const visibleTabs = json.tabs.filter(t => !s.hiddenSheetNames.includes(t));
      s.projects = visibleTabs.map(tabName => {
        const existing = s.projects.find(p => p.sheetName === tabName);
        return existing || { id: "p_" + tabName.replace(/\s+/g, "_") + "_" + Date.now(), name: tabName, sheetName: tabName };
      });
      saveSubsidies(subsidies);
      const hiddenNote = s.hiddenSheetNames.length ? `, скрыто: ${s.hiddenSheetNames.length}` : "";
      statusEl.textContent = `✅ Найдено листов: ${json.tabs.length}${hiddenNote}`;
      renderApp();
    } else {
      statusEl.textContent = "❌ " + (json.error || "Ошибка");
    }
  } catch (err) {
    statusEl.textContent = "❌ " + err.message;
  }
}

function computeColumnSpans(items, columns) {
  // Эвристика объединённых ячеек: если значение колонки пустое, а в
  // предыдущей(-их) строке(-ах) для этой же колонки уже было значение —
  // считаем это продолжением объединённой ячейки Google Таблицы и не
  // выводим её отдельно, увеличивая rowspan исходной ячейки.
  const spans = items.map(() => ({}));
  columns.forEach(col => {
    let lastNonEmptyIdx = null;
    items.forEach((item, i) => {
      const val = item[col];
      const isEmpty = val === undefined || val === null || String(val).trim() === "";
      if (isEmpty && lastNonEmptyIdx !== null) {
        spans[i][col] = { skip: true };
        spans[lastNonEmptyIdx][col].rowspan++;
      } else {
        spans[i][col] = { skip: false, rowspan: 1 };
        lastNonEmptyIdx = isEmpty ? null : i;
      }
    });
  });
  return spans;
}

function isCommentColumn(colName) {
  return /коммент/i.test(colName);
}

function isStatusColumn(colName) {
  return /статус/i.test(colName);
}

// Цвета статусов подобраны под типичную цветовую разметку в Google
// Таблицах для колонки "Статус договора". При необходимости можно
// расширить список — для неизвестных статусов используется серый.
const STATUS_COLORS = [
  { match: /подписан/i, bg: "#d1fae5", color: "#047857" },
  { match: /не\s*подписан|ожида/i, bg: "#fef3c7", color: "#92400e" },
  { match: /расторгн|отменен|отменён/i, bg: "#fee2e2", color: "#b91c1c" },
  { match: /подготовлен|в работе|на согласовании/i, bg: "#dbeafe", color: "#1e40af" },
  { match: /не начат/i, bg: "#f3f4f6", color: "#6b7280" },
];
function getStatusColor(value) {
  const found = STATUS_COLORS.find((s) => s.match.test(value));
  return found || { bg: "#f3f4f6", color: "#374151" };
}

// Колонки, которые считаются "полями учёта" (номера/даты договоров, актов,
// платёжек) — если в них уже есть значение, ячейка подсвечивается зелёным,
// чтобы сразу было видно, что по этой позиции уже что-то оформлено.
function isTrackingColumn(colName) {
  if (isStatusColumn(colName)) return false;
  // \b (граница слова) в JS не распознаёт кириллицу как "словесные" символы,
  // поэтому регулярка с \b работает непредсказуемо на русском тексте.
  // Вместо этого разбиваем заголовок на отдельные слова и сравниваем их
  // целиком - это исключает случайные совпадения внутри других слов
  // (напр. "акт" внутри "фактически", "характеристика", "контакт").
  const words = String(colName).toLowerCase().split(/[^а-яёa-z0-9]+/).filter(Boolean);
  return words.some((w) =>
    w.startsWith("договор") ||
    w === "счёт" || w === "счет" ||
    w === "упд" ||
    w === "акт" ||
    w.startsWith("платежн")
  );
}

function renderBudgetTable() {
  if (smetaState.loadedItems === null) return `<div class="hint" style="margin-top:12px">Загрузка...</div>`;
  if (smetaState.loadedItems.length === 0) return `<div class="hint" style="margin-top:12px">В этом листе нет строк с подрядчиком (или лист пуст).</div>`;

  // Показываем ВСЕ колонки, которые реально есть в загруженных строках
  // (кроме служебных полей, начинающихся с "_" — они не из таблицы).
  const columns = Object.keys(smetaState.loadedItems[0]).filter(k => !k.startsWith("_"));
  const spans = computeColumnSpans(smetaState.loadedItems, columns);
  // Реальные колонки учёта - определяются по тем заголовкам, что
  // действительно есть в загруженной таблице, а не по угаданным заранее
  // названиям. Это гарантирует, что запись обратно попадёт точно в нужную
  // колонку, какой бы текст заголовка ни был в конкретной смете.
  const trackingColumns = columns.filter(isTrackingColumn);

  const rows = smetaState.loadedItems.map((item, idx) => {
    const isEditing = smetaState.editingRow === idx;
    const trackingFieldsHtml = trackingColumns.length ? trackingColumns.map((c, fi) => `
      <div style="margin-top:${fi===0?'0':'12px'}">
        <label>${c}</label>
        <input type="text" data-track-field="${idx}:${c}" value="${(item[c] && String(item[c]).trim() !== '' ? item[c] : '').toString().replace(/"/g,'&quot;')}">
      </div>
    `).join("") : `<div class="hint">В этой таблице не нашлось колонок учёта (Договор/Счёт/УПД/акт/Платёжное) — писать пока некуда.</div>`;
    const trackingForm = isEditing ? `
      <tr><td colspan="${columns.length + 1}" style="background:#fafafa">
        ${trackingFieldsHtml}
        <div style="margin-top:12px">
          <button class="btn btn-primary btn-small" data-save-tracking="${idx}">Сохранить в Таблицу</button>
          <button class="btn btn-secondary btn-small" data-cancel-tracking="${idx}">Отмена</button>
        </div>
        <div id="trackStatus_${idx}" style="margin-top:8px;font-size:12px"></div>
      </td></tr>` : "";

    const cells = columns.map(c => {
      const span = spans[idx][c];
      if (span.skip) return ""; // ячейка "поглощена" объединением выше
      const rowspanAttr = span.rowspan > 1 ? ` rowspan="${span.rowspan}"` : "";
      const raw = item[c];
      const isEmpty = raw === undefined || raw === null || String(raw).trim() === "";
      const value = isEmpty ? "—" : raw;

      if (isCommentColumn(c) && !isEmpty) {
        return `<td${rowspanAttr}><details><summary style="cursor:pointer;color:#dc2626;font-weight:600">Подробнее</summary><div style="margin-top:6px">${value}</div></details></td>`;
      }
      if (isStatusColumn(c) && !isEmpty) {
        const sc = getStatusColor(String(value));
        return `<td${rowspanAttr}><span style="display:inline-block;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:600;background:${sc.bg};color:${sc.color}">${value}</span></td>`;
      }
      if (isTrackingColumn(c) && !isEmpty) {
        return `<td${rowspanAttr} style="background:#ecfdf5;color:#047857;font-weight:600">${value}</td>`;
      }
      return `<td${rowspanAttr}>${value}</td>`;
    }).join("");

    return `<tr>${cells}<td><button class="btn btn-primary btn-small" data-edit-tracking="${idx}">Обновить учёт</button></td></tr>${trackingForm}`;
  }).join("");

  return `<div style="overflow-x:auto"><table class="budget-table"><thead><tr>${columns.map(c=>`<th>${c}</th>`).join("")}<th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

async function handleLoadBudget() {
  const subsidy = findSubsidy(smetaState.selectedSubsidyId);
  const project = findProject(subsidy, smetaState.selectedProjectId);
  const siteUrl = window.location.origin;
  const statusEl = document.getElementById("smetaLoadStatus");
  if (!subsidy.spreadsheetUrl) { alert("Сначала укажите ссылку на Google Таблицу для этой субсидии в разделе ⚙ Настройки"); return; }

  statusEl.textContent = "Загружаю...";
  try {
    const res = await fetch(`${siteUrl}/.netlify/functions/read-budget-sheet`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ spreadsheetId: extractSpreadsheetId(subsidy.spreadsheetUrl), sheetName: project.sheetName }),
    });
    const json = await res.json();
    if (res.ok && json.success) {
      smetaState.loadedItems = json.items;
      statusEl.textContent = `✅ Загружено строк: ${json.items.length}`;
    } else {
      statusEl.textContent = "❌ " + (json.error || "Ошибка загрузки");
    }
  } catch (err) {
    statusEl.textContent = "❌ Не удалось отправить запрос: " + err.message;
  }
  renderApp();
}

async function handleSaveTracking(idx) {
  const subsidy = findSubsidy(smetaState.selectedSubsidyId);
  const project = findProject(subsidy, smetaState.selectedProjectId);
  const siteUrl = window.location.origin;
  const item = smetaState.loadedItems[idx];
  const statusEl = document.getElementById(`trackStatus_${idx}`);

  const updates = {};
  document.querySelectorAll(`[data-track-field^="${idx}:"]`).forEach(inp => {
    const header = inp.dataset.trackField.slice(String(idx).length + 1); // отрезаем "idx:" спереди
    if (inp.value && inp.value.trim() !== "") updates[header] = inp.value;
  });

  if (Object.keys(updates).length === 0) { statusEl.textContent = "Нечего сохранять — заполните хотя бы одно поле."; return; }

  statusEl.textContent = "Сохраняю...";
  try {
    const res = await fetch(`${siteUrl}/.netlify/functions/write-budget-tracking`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ spreadsheetId: extractSpreadsheetId(subsidy.spreadsheetUrl), sheetName: project.sheetName, rowNumber: item._row, updates }),
    });
    const json = await res.json();
    if (res.ok && json.success) {
      const notFound = json.results.filter(r => !r.written);
      statusEl.textContent = notFound.length
        ? "⚠️ Часть колонок не найдена в таблице: " + notFound.map(r => r.header).join(", ")
        : "✅ Сохранено";
    } else {
      statusEl.textContent = "❌ " + (json.error || "Ошибка сохранения");
    }
  } catch (err) {
    statusEl.textContent = "❌ " + err.message;
  }
}

const MONTH_NAMES = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const MONTH_NAMES_GENITIVE = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const KVR_CODES = ["613", "623", "632", "812"];
// Код КВР по умолчанию для каждой субсидии - в изученных образцах
// казначейского обеспечения СПбГУПТД показывал сумму в строке 613,
// НПТ - в строке 812. Можно поменять вручную на любой из 4 кодов.
const KVR_DEFAULTS = { rddm_spbguptd: "613", rddm_npt: "812" };

// planningData[subsidyId] = { entries: [ {project,year,month,amount,day,kvr} ] } -
// локальный кэш того, что реально загружено с сервера для этой субсидии.
let planningData = {};
let planningLoadedSubsidyId = null; // какая субсидия сейчас реально загружена в кэш

let planningSelectedSubsidyId = null; // подставляется в showApp() по правам пользователя
let planningSelectedProjectId = null;
let planningSelectedYear = new Date().getFullYear();

function emptyPlanMonth(subsidyId) {
  return { amount: 0, day: "", kvr: KVR_DEFAULTS[subsidyId] || KVR_CODES[0] };
}
function getPlanMonths(subsidyId, projectId, year) {
  const cache = planningData[subsidyId];
  const project = findProject(findSubsidy(subsidyId), projectId);
  const projectName = project ? project.name : null;
  const months = Array.from({ length: 12 }, () => emptyPlanMonth(subsidyId));
  if (!cache || !projectName) return months;
  cache.entries
    .filter(e => e.project === projectName && String(e.year) === String(year))
    .forEach(e => {
      const idx = MONTH_NAMES.indexOf(e.month);
      if (idx !== -1) months[idx] = { amount: parseFloat(e.amount) || 0, day: e.day || "", kvr: e.kvr || (KVR_DEFAULTS[subsidyId] || KVR_CODES[0]) };
    });
  return months;
}

async function loadPlanningForSubsidy(subsidyId) {
  try {
    const snap = await fbDb.collection("planning").where("subsidyId", "==", subsidyId).get();
    planningData[subsidyId] = { entries: snap.docs.map(d => ({ ...d.data(), _docId: d.id })) };
  } catch (e) {
    planningData[subsidyId] = { entries: [] };
  }
  planningLoadedSubsidyId = subsidyId;
}

async function savePlanMonth(subsidyId, projectId, year, monthIdx, monthData) {
  const subsidy = findSubsidy(subsidyId);
  const project = findProject(subsidy, projectId);
  if (!subsidy || !project) return { success: false, error: "Не выбрана субсидия/проект." };

  const month = MONTH_NAMES[monthIdx];
  // Один документ на комбинацию субсидия+проект+год+месяц - предсказуемый ID,
  // повторное сохранение того же месяца просто перезаписывает документ, а
  // не плодит дубликаты.
  const docId = `${subsidyId}_${project.name}_${year}_${month}`.replace(/[^a-zA-Zа-яА-Я0-9_]/g, "_");
  const newEntry = { subsidyId, project: project.name, year: String(year), month, amount: monthData.amount, day: monthData.day, kvr: monthData.kvr };

  // Обновляем локальный кэш сразу, чтобы интерфейс не ждал ответ сервера
  if (!planningData[subsidyId]) planningData[subsidyId] = { entries: [] };
  const cache = planningData[subsidyId];
  const existingIdx = cache.entries.findIndex(e => e._docId === docId);
  if (existingIdx !== -1) cache.entries[existingIdx] = { ...newEntry, _docId: docId }; else cache.entries.push({ ...newEntry, _docId: docId });

  try {
    await fbDb.collection("planning").doc(docId).set(newEntry);
    return { success: true };
  } catch (e) {
    return { success: false, error: e.message };
  }
}

    ${exportSection}

function attachPlanningHandlers() {
  if (planningSelectedSubsidyId && planningLoadedSubsidyId !== planningSelectedSubsidyId) {
    loadPlanningForSubsidy(planningSelectedSubsidyId).then(() => { if (currentPage === "planning") renderApp(); });
    return;
  }

  document.getElementById("planningSubsidySelect").onchange = (e) => { planningSelectedSubsidyId = e.target.value; planningSelectedProjectId = null; renderApp(); };
  const projSel = document.getElementById("planningProjectSelect");
  if (projSel) projSel.onchange = (e) => { planningSelectedProjectId = e.target.value; renderApp(); };
  document.getElementById("planningYearInput").onchange = (e) => { planningSelectedYear = parseInt(e.target.value) || new Date().getFullYear(); renderApp(); };

  document.querySelectorAll("[data-plan-field]").forEach(inp => {
    // oninput - для мгновенного пересчёта "Итого" в интерфейсе
    inp.oninput = () => {
      if (inp.dataset.planField.endsWith(":amount")) {
        const monthIdx = parseInt(inp.dataset.planField.split(":")[0]);
        const months = getPlanMonths(planningSelectedSubsidyId, planningSelectedProjectId, planningSelectedYear);
        months[monthIdx] = { ...months[monthIdx], amount: parseFloat(inp.value) || 0 };
        const total = months.reduce((a, m) => a + (parseFloat(m.amount) || 0), 0);
        const totalEl = [...document.querySelectorAll('.card div')].find(d => d.textContent.includes('Итого за год'));
        if (totalEl) totalEl.textContent = `Итого за год: ${formatRuNumber(total)} руб.`;
      }
    };
    // onchange (при потере фокуса) - реальное сохранение на сервер, чтобы не
    // слать запрос на каждое нажатие клавиши.
    inp.onchange = async () => {
      const [monthIdxStr, field] = inp.dataset.planField.split(":");
      const monthIdx = parseInt(monthIdxStr);
      const months = getPlanMonths(planningSelectedSubsidyId, planningSelectedProjectId, planningSelectedYear);
      const updatedMonth = { ...months[monthIdx], [field]: field === "amount" ? (parseFloat(inp.value) || 0) : inp.value };
      const statusEl = document.getElementById("planSaveStatus");
      if (statusEl) statusEl.textContent = "Сохраняю...";
      const result = await savePlanMonth(planningSelectedSubsidyId, planningSelectedProjectId, planningSelectedYear, monthIdx, updatedMonth);
      if (statusEl) statusEl.textContent = result.success ? "✅ Сохранено" : "❌ " + (result.error || "Ошибка сохранения");
    };
  });

  const exportBtn = document.getElementById("exportKaznBtn");
  if (exportBtn) exportBtn.onclick = handleExportCashPlan;
}

// ============================================================
// ЧИСЛО ПРОПИСЬЮ (перенесено из google_integration/number_to_words_ru.js,
// та же проверенная логика - нужна и здесь, поскольку выгрузка заявки на
// казначейское обеспечение генерируется прямо в браузере, без обращения
// к серверу).
// ============================================================
const RU_ONES = {
  m: ["", "один", "два", "три", "четыре", "пять", "шесть", "семь", "восемь", "девять"],
  f: ["", "одна", "две", "три", "четыре", "пять", "шесть", "семь", "восемь", "девять"],
};
const RU_TEENS = ["десять", "одиннадцать", "двенадцать", "тринадцать", "четырнадцать", "пятнадцать", "шестнадцать", "семнадцать", "восемнадцать", "девятнадцать"];
const RU_TENS = ["", "", "двадцать", "тридцать", "сорок", "пятьдесят", "шестьдесят", "семьдесят", "восемьдесят", "девяносто"];
const RU_HUNDREDS = ["", "сто", "двести", "триста", "четыреста", "пятьсот", "шестьсот", "семьсот", "восемьсот", "девятьсот"];
const RU_SCALES = [
  { forms: ["рубль", "рубля", "рублей"], gender: "m" },
  { forms: ["тысяча", "тысячи", "тысяч"], gender: "f" },
  { forms: ["миллион", "миллиона", "миллионов"], gender: "m" },
  { forms: ["миллиард", "миллиарда", "миллиардов"], gender: "m" },
];
function ruPluralize(n, forms) {
  const mod100 = n % 100, mod10 = n % 10;
  if (mod100 >= 11 && mod100 <= 14) return forms[2];
  if (mod10 === 1) return forms[0];
  if (mod10 >= 2 && mod10 <= 4) return forms[1];
  return forms[2];
}
function ruThreeDigitToWords(n, gender) {
  const words = [];
  const hundreds = Math.floor(n / 100);
  const remainder = n % 100;
  if (hundreds) words.push(RU_HUNDREDS[hundreds]);
  if (remainder >= 10 && remainder < 20) {
    words.push(RU_TEENS[remainder - 10]);
  } else {
    const tens = Math.floor(remainder / 10);
    const ones = remainder % 10;
    if (tens) words.push(RU_TENS[tens]);
    if (ones) words.push(RU_ONES[gender][ones]);
  }
  return words;
}
function amountToWordsRu(amount) {
  const n = typeof amount === "string" ? parseInt(amount.replace(/[^\d]/g, ""), 10) : Math.floor(amount);
  if (!Number.isFinite(n) || n < 0) throw new Error(`amountToWordsRu: некорректное значение "${amount}"`);
  if (n === 0) return "Ноль";
  const groups = [];
  let remaining = n;
  while (remaining > 0) { groups.push(remaining % 1000); remaining = Math.floor(remaining / 1000); }
  const parts = [];
  for (let i = groups.length - 1; i >= 0; i--) {
    const group = groups[i];
    if (group === 0) continue;
    const scale = RU_SCALES[i];
    if (!scale) throw new Error(`amountToWordsRu: сумма слишком велика`);
    parts.push(...ruThreeDigitToWords(group, scale.gender));
    if (i > 0) parts.push(ruPluralize(group, scale.forms));
  }
  const result = parts.join(" ");
  return result.charAt(0).toUpperCase() + result.slice(1);
}

function parseDateToRuParts(dateStr) {
  // "19.05.2026" -> { day: "19", monthGenitive: "мая", year: "2026" }
  const [day, month, year] = dateStr.split(".");
  const idx = parseInt(month, 10) - 1;
  return { day: String(parseInt(day, 10)), monthGenitive: MONTH_NAMES_GENITIVE[idx] || "", year };
}

async function handleExportCashPlan() {
  const statusEl = document.getElementById("exportKaznStatus");
  const monthIdx = parseInt(document.getElementById("exportMonthSelect").value);
  const templateFile = KAZNA_TEMPLATE_MAP[planningSelectedSubsidyId];

  if (!templateFile) { statusEl.textContent = "❌ Для этой субсидии нет шаблона заявки."; return; }
  if (typeof window.docxtemplater === "undefined" || typeof window.PizZip === "undefined") {
    statusEl.textContent = "❌ Не удалось загрузить библиотеку для создания Word-файла (проверьте интернет-соединение и обновите страницу).";
    return;
  }

  const months = getPlanMonths(planningSelectedSubsidyId, planningSelectedProjectId, planningSelectedYear);
  const monthData = months[monthIdx];
  if (!monthData || !monthData.amount || !monthData.day) {
    statusEl.textContent = "⚠️ Для выбранного месяца не заполнена сумма или дата оплаты.";
    return;
  }

  const grant = GRANTS[planningSelectedSubsidyId];
  const dateParts = parseDateToRuParts(grant.grant_agreement_date);

  const data = {
    grant_agreement_number: grant.grant_agreement_number,
    grant_agreement_day: dateParts.day,
    grant_agreement_month_genitive: dateParts.monthGenitive,
    grant_agreement_year: dateParts.year,
    plan_month_name: MONTH_NAMES[monthIdx],
    plan_year: String(planningSelectedYear),
    plan_amount_numeric: formatRuNumber(monthData.amount),
    plan_amount_words: amountToWordsRu(Math.floor(monthData.amount)),
  };
  // Заполняем все 132 ячейки таблицы (4 кода КВР × 31 день + Итого) -
  // пустыми по умолчанию, кроме выбранного дня/кода за этот месяц.
  for (const kvr of ["613", "623", "632", "812"]) {
    for (let d = 1; d <= 31; d++) data[`kvr${kvr}_day${d}`] = "";
    data[`kvr${kvr}_total`] = "";
  }
  const day = parseInt(monthData.day);
  data[`kvr${monthData.kvr}_day${day}`] = formatRuNumber(monthData.amount);
  data[`kvr${monthData.kvr}_total`] = formatRuNumber(monthData.amount);

  statusEl.textContent = "Готовлю файл...";
  try {
    const res = await fetch(`${window.location.origin}/templates/${templateFile}`);
    if (!res.ok) throw new Error(`Шаблон не найден по адресу /templates/${templateFile} (код ${res.status})`);
    const arrayBuffer = await res.arrayBuffer();

    const zip = new window.PizZip(arrayBuffer);
    const doc = new window.docxtemplater(zip, {
      paragraphLoop: true,
      linebreaks: true,
      nullGetter: () => "",
    });
    doc.render(data);

    const blob = doc.getZip().generate({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `Заявка_КВР_${planningSelectedSubsidyId}_${MONTH_NAMES[monthIdx]}_${planningSelectedYear}.docx`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    window.URL.revokeObjectURL(url);

    statusEl.textContent = "✅ Файл скачан.";
  } catch (err) {
    statusEl.textContent = "❌ " + err.message;
  }
}

async function handleGeneratePayment() {
  const statusEl = document.getElementById("docGenerateStatus");
  const amount = parseRuNumber(documentsState.rows[0] && documentsState.rows[0].price);
  if (!amount || !documentsState.contractNumber || !documentsState.docNumber || !documentsState.paymentDescription) {
    statusEl.textContent = "⚠️ Заполните сумму, описание, номер договора и номер закрывающего документа.";

  }
  const kbkInfo = PAYMENT_KBK[documentsState.grantId];

  const appendixRef = documentsState.appendixNumber ? ` (Приложение №${documentsState.appendixNumber})` : "";
  const closingWord = documentsState.closingDocLabel === "Акт" ? "Акт" : "Товарная накладная";
  const grounds = `Договор №${documentsState.contractNumber} от ${documentsState.contractDate}${appendixRef} ${closingWord} №${documentsState.docNumber} от ${documentsState.docDate} г.`;

  await generateDocxFromTemplate(DOCUMENT_TEMPLATE_MAP.payment, data, `Заявление_на_оплату_${documentsState.docNumber}`.replace(/[\\/]/g, "-"), statusEl);
}

async function generateDocxFromTemplate(templateFile, data, fileNameBase, statusEl) {
  if (typeof window.docxtemplater === "undefined" || typeof window.PizZip === "undefined") {
    statusEl.textContent = "❌ Не удалось загрузить библиотеку для создания Word-файла.";
    return;
  }
  statusEl.textContent = "Готовлю файл...";
  try {
    const res = await fetch(`${window.location.origin}/templates/${templateFile}`);
    if (!res.ok) throw new Error(`Шаблон не найден по адресу /templates/${templateFile} (код ${res.status})`);
    const arrayBuffer = await res.arrayBuffer();
    const zip = new window.PizZip(arrayBuffer);
    const doc = new window.docxtemplater(zip, { paragraphLoop: true, linebreaks: true, nullGetter: () => "" });
    doc.render(data);
    const blob = doc.getZip().generate({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `${fileNameBase}.docx`;
    document.body.appendChild(a); a.click(); a.remove();
    window.URL.revokeObjectURL(url);
    statusEl.textContent = "✅ Файл скачан.";
  } catch (err) {
    statusEl.textContent = "❌ " + err.message;
  }
}

// ============================================================
let tasksCache = null; // массив задач, загруженных из Firestore
let tasksLoaded = false;
let dashboardShowAll = false; // false = только мои задачи, true = все

function loadKnownLists() {
  try { return JSON.parse(window.localStorage.getItem("knownTaskLists") || "[]"); } catch (e) { return []; }
}
function saveKnownLists(lists) { window.localStorage.setItem("knownTaskLists", JSON.stringify(lists)); }

async function loadTasks() {
  try {
    const snap = await fbDb.collection("tasks").get();
    tasksCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) {
    tasksCache = [];
  }
  tasksLoaded = true;
}

const TASK_STATUSES = ["Не начато", "В работе", "Готово"];
function nextStatus(status) {
  const idx = TASK_STATUSES.indexOf(status);
  return TASK_STATUSES[(idx + 1) % TASK_STATUSES.length];
}
function statusColor(status) {
  if (status === "Готово") return { bg: "#d1fae5", color: "#047857" };
  if (status === "В работе") return { bg: "#dbeafe", color: "#1e40af" };
  return { bg: "#f3f4f6", color: "#6b7280" };
}

function renderDashboardPage() {
  if (!tasksLoaded) return `<div class="card"><h2>Дашборд</h2><div class="hint">Загрузка...</div></div>`;

  const knownLists = loadKnownLists();
  const listsFromTasks = [...new Set(tasksCache.map(t => t.list))];
  const allLists = [...new Set([...knownLists, ...listsFromTasks])];

  const visibleTasks = dashboardShowAll ? tasksCache : tasksCache.filter(t => t.assignee === currentUser.username);

  const listBlocks = allLists.map(listName => {
    const tasksInList = visibleTasks.filter(t => t.list === listName);
    const rows = tasksInList.map(t => {
      const sc = statusColor(t.status);
      return `<tr>
        <td><span data-cycle-status="${t.id}" style="cursor:pointer;display:inline-block;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:600;background:${sc.bg};color:${sc.color}">${t.status}</span></td>
        <td>${t.title}</td>
        <td>${t.assignee || "—"}</td>
        <td>${t.dueDate || "—"}</td>
        <td><button class="btn-danger-text" data-delete-task="${t.id}">Удалить</button></td>
      </tr>`;
    }).join("");
    return `
    <div class="card card-wide" style="margin-bottom:16px">
      <h3 style="margin-top:0">${listName}</h3>
      ${tasksInList.length ? `<table class="budget-table"><thead><tr><th>Статус</th><th>Задача</th><th>Исполнитель</th><th>Срок</th><th></th></tr></thead><tbody>${rows}</tbody></table>` : `<div class="hint">Задач пока нет.</div>`}
      <button class="btn btn-secondary btn-small" style="margin-top:12px" data-add-task-to-list="${listName}">+ Добавить задачу</button>
    </div>`;
  }).join("");

  return `
  <div class="card card-wide">
    <h2>Дашборд</h2>
    <div class="checkbox-row" style="margin-top:0">
      <input type="checkbox" id="dashboardShowAllCheck" ${dashboardShowAll ? "checked" : ""}>
      <label for="dashboardShowAllCheck">Показать задачи всех пользователей (не только мои)</label>
    </div>
  </div>
  ${listBlocks || '<div class="card card-wide"><div class="hint">Списков пока нет — добавьте первый.</div></div>'}
  <button class="btn btn-secondary" id="addListBtn">+ Добавить список</button>`;
}

function attachDashboardHandlers() {
  if (!tasksLoaded) {
    loadTasks().then(() => { if (currentPage === "dashboard") renderApp(); });
    return;
  }

  document.getElementById("addListBtn").onclick = () => {
    const name = prompt("Название нового списка (например, название проекта):");
    if (!name) return;
    const lists = loadKnownLists();
    if (!lists.includes(name)) { lists.push(name); saveKnownLists(lists); }
    renderApp();
  };

  document.getElementById("dashboardShowAllCheck").onchange = (e) => { dashboardShowAll = e.target.checked; renderApp(); };

  document.querySelectorAll("[data-add-task-to-list]").forEach(btn => {
    btn.onclick = async () => {
      const listName = btn.dataset.addTaskToList;
      const title = prompt("Название задачи:");
      if (!title) return;
      const assignee = prompt("Исполнитель (логин):", currentUser.username) || currentUser.username;
      const dueDate = prompt("Срок (напр. 20.08.2026), можно оставить пустым:") || "";
      const id = "t_" + Date.now();
      const task = { id, list: listName, title, assignee, status: "Не начато", dueDate };
      tasksCache.push(task);
      renderApp();
      const { id: _drop, ...taskData } = task;
      await fbDb.collection("tasks").doc(id).set(taskData);
    };
  });

  document.querySelectorAll("[data-cycle-status]").forEach(el => {
    el.onclick = async () => {
      const id = el.dataset.cycleStatus;
      const task = tasksCache.find(t => t.id === id);
      if (!task) return;
      task.status = nextStatus(task.status);
      renderApp();
      await fbDb.collection("tasks").doc(id).update({ status: task.status });
    };
  });

  document.querySelectorAll("[data-delete-task]").forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.deleteTask;
      if (!confirm("Удалить задачу?")) return;
      tasksCache = tasksCache.filter(t => t.id !== id);
      renderApp();
      await fbDb.collection("tasks").doc(id).delete();
    };
  });
}

function renderApp() {
  const app = document.getElementById("app");
  if (currentPage === "dashboard") { app.innerHTML = renderDashboardPage(); attachDashboardHandlers(); return; }
  if (currentPage === "documents") { app.innerHTML = renderDocumentsPage(); attachDocumentsHandlers(); return; }
  if (currentPage === "settings") { app.innerHTML = renderSettings(); attachSettingsHandlers(); return; }
  if (currentPage === "smeta") { app.innerHTML = renderSmetaPage(); attachSmetaHandlers(); return; }
  if (currentPage === "planning") { app.innerHTML = renderPlanningPage(); attachPlanningHandlers(); return; }
  if (currentStep === 0) app.innerHTML = renderStep1();
  else if (currentStep === 1) app.innerHTML = renderStep2();
  else if (currentStep === 2) app.innerHTML = renderStep3();
  else if (currentStep === 3) app.innerHTML = renderStep4();
  else if (currentStep === 4) app.innerHTML = renderStep5();
  attachHandlers();
}

  const fields = CONTRACTOR_FIELD_SETS[variant] || [];
  const registryFiltered = CONTRACTORS_REGISTRY.filter(c => c.type === variant);
  const registryHtml = registryFiltered.length ? `<h3>Выбрать из справочника</h3>${registryFiltered.map(c => `<div class="contractor-card ${state.selectedContractorId===c.id?'selected':''}" data-contractor-id="${c.id}">${c.short_name}</div>`).join("")}<div class="hint">Или заполните поля вручную ниже.</div>` : `<div class="hint">Справочник для этого типа пуст — заполните поля вручную.</div>`;
  const fieldsHtml = fields.map(f => `<label class="required">${f.label}</label><input type="text" required data-contractor-field="${f.name}" value="${state.contractor[f.name] || ''}">`).join("");
  return `<div class="card"><h2>Шаг 2 — Стороны (${CONTRACT_CONFIGS[configKey()].roleLabels.contractor})</h2>
  ${registryHtml}<h3>Реквизиты</h3>${fieldsHtml}
  <div class="checkbox-row"><input type="checkbox" id="notEmployeeCheck" ${state.notEmployeeConfirmed?'checked':''}><label for="notEmployeeCheck" class="required">Подтверждаю: контрагент не является сотрудником/студентом СПбГУПТД</label></div>
  </div><div class="nav-buttons"><button class="btn btn-secondary" id="backBtn">← Назад</button><button class="btn btn-primary" id="nextBtn">Далее →</button></div>`;
}

function renderStep3() {
  const config = currentConfig();
  const bodyHtml = config.bodyFields.map(f => `<label class="required">${BODY_FIELD_LABELS[f]||f}</label><input type="text" required data-body-field="${f}" value="${state.bodyValues[f]||''}">`).join("");
  return `<div class="card"><h2>Шаг 3 — Тело договора</h2>
  <div class="row2"><div><label class="required">Номер договора</label><input type="text" required id="contractNumber" value="${state.contractNumber}" placeholder="напр. РОСМОЛ-08-2026"></div><div><label class="required">Дата договора</label><input type="text" required id="contractDate" value="${state.contractDate}" placeholder="напр. 10.08.2026"></div></div>
  <label>Пункт Положения о закупке</label><input type="text" id="polozhenieClause" value="${state.polozhenieClause}">
  <h3>Предмет и сроки</h3>${bodyHtml}
  <h3>Оплата</h3><label>НДС</label><input type="text" id="vatClause" value="${state.vatClause}"><div class="hint">Сумма договора считается автоматически из строк таблиц на следующем шаге.</div>
  </div><div class="nav-buttons"><button class="btn btn-secondary" id="backBtn">← Назад</button><button class="btn btn-primary" id="nextBtn">Далее →</button></div>`;
}

function renderStep4() {
  ensureAppendices();
  const config = currentConfig();
  const isRental = state.contractType === "rental_400";
  const appendixBlocks = state.appendices.map((appendix, aIdx) => {
    const fieldsHtml = config.appendixFields.map(f => `<label class="required">${APPENDIX_FIELD_LABELS[f]||f}</label><input type="text" required data-appendix-idx="${aIdx}" data-appendix-field="${f}" value="${appendix.values[f]||''}">`).join("");
    const rowsHtml = appendix.rows.map((row, rIdx) => `<tr>${config.rowFields.map(f => {
      const isTotalField = f.name === config.calcFields.total;
      const isCalcInput = f.name === config.calcFields.qty || f.name === config.calcFields.price;
      const calcAttr = isCalcInput ? `data-calc-row="${aIdx}"` : "";
      const requiredAttr = isCalcInput ? "required" : "";
      const readonly = isTotalField ? "readonly style=\"background:#f5f5f5;color:#555\"" : "";
      return `<td><input type="text" ${readonly} ${requiredAttr} data-a="${aIdx}" data-r="${rIdx}" data-f="${f.name}" ${calcAttr} value="${row[f.name]||''}"></td>`;
    }).join("")}<td><button class="btn-danger-text" data-remove-row="${aIdx}:${rIdx}">✕</button></td></tr>`).join("");
    const totalLabel = isRental ? "" : `<label>Итог приложения, руб. <small class="gray">(считается автоматически)</small></label><div id="appendixTotalDisplay-${aIdx}" style="font-weight:600;font-size:15px;padding:6px 0">${formatRuNumber(computeAppendixTotalRub(appendix, config))} руб.</div>`;
    return `<div class="appendix-block"><h4>Приложение ${aIdx+1}</h4>${fieldsHtml}<table class="row-table"><thead><tr>${config.rowFields.map(f=>`<th>${f.label}</th>`).join("")}<th></th></tr></thead><tbody>${rowsHtml}</tbody></table><button class="btn btn-secondary" style="margin-top:8px;font-size:12px;padding:6px 12px" data-add-row="${aIdx}">+ Добавить строку</button>${totalLabel}</div>`;
  }).join("");

  const rentalBlock = isRental ? `<div class="card"><h3>Итоги по аренде</h3>
    <label class="required">Количество дней аренды</label>
    <input type="number" id="rentalDays" value="${state.rental?.days || 1}" min="1" style="max-width:140px">
    <div class="row2" style="margin-top:14px">
      <div><label>Стоимость за 1 сутки <small class="gray">(авто)</small></label><div id="rentalDailyDisplay" style="font-weight:600;padding:6px 0">${formatRuNumber(computeRentalDailyTotalRub(state, config))} руб.</div></div>
      <div><label>ИТОГО за весь срок <small class="gray">(авто)</small></label><div id="rentalTotalDisplay" style="font-weight:600;padding:6px 0">${formatRuNumber(computeContractTotalRub(state, config))} руб.</div></div>
    </div></div>` : "";

  return `<div class="card"><h2>Шаг 4 — Приложения (${config.appendixCount})</h2><div class="hint">Сумма строки = количество × цена, считается автоматически. Просто впишите количество и цену.</div>${appendixBlocks}</div>${rentalBlock}
  <div class="nav-buttons"><button class="btn btn-secondary" id="backBtn">← Назад</button><button class="btn btn-primary" id="nextBtn">Далее →</button></div>`;
}

function renderStep5() {
  const config = currentConfig();
  const grant = GRANTS[state.grantId];
  let payload = null, buildError = null;
  try { payload = buildPayload(state, config, grant); } catch (e) { buildError = e.message; }
  const rows = [["Тип договора",config.label],["Грант",grant.label],["Номер / дата",`${state.contractNumber} от ${state.contractDate}`],["Контрагент",state.contractor.contractor_full_name||"—"],["Сумма (авто)",formatRuNumber(computeContractTotalRub(state, config))+" руб."],["Приложений",config.appendixCount]];
  return `<div class="card"><h2>Шаг 5 — Проверка и генерация</h2>
  <table class="review-table">${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table>
  ${buildError?`<div class="warning-box">⚠️ ${buildError}</div>`:""}
  <div style="margin-top:18px"><button class="btn btn-primary" id="generateBtn" ${buildError?'disabled':''}>Сгенерировать и скачать договор</button></div>
  <div id="resultBox"></div></div>
  <div class="nav-buttons"><button class="btn btn-secondary" id="backBtn">← Назад</button><div></div></div>`;
}

function attachHandlers() {
  const backBtn = document.getElementById("backBtn"); if (backBtn) backBtn.onclick = () => goToStep(currentStep-1);
  const nextBtn = document.getElementById("nextBtn"); if (nextBtn) nextBtn.onclick = () => { if (!validateCurrentStep()) return; saveCurrentStep(); goToStep(currentStep+1); };
  if (currentStep === 0) {
    document.querySelectorAll("#typeOptions .radio-option").forEach(el => { el.onclick = () => { state.contractType = el.dataset.type; state.contractorVariant = el.dataset.variant; state.appendices = []; renderApp(); }; });
    document.getElementById("grantSelect").onchange = (e) => { state.grantId = e.target.value; };
  }
  if (currentStep === 1) {
    document.querySelectorAll(".contractor-card").forEach(el => { el.onclick = () => { const c = CONTRACTORS_REGISTRY.find(x => x.id === el.dataset.contractorId); state.selectedContractorId = c.id; state.contractor = { ...c }; delete state.contractor.id; delete state.contractor.type; delete state.contractor.short_name; renderApp(); }; });
  }
  if (currentStep === 3) {
    document.querySelectorAll("[data-add-row]").forEach(btn => { btn.onclick = () => { const aIdx = parseInt(btn.dataset.addRow); state.appendices[aIdx].rows.push(emptyRow(currentConfig())); renderApp(); }; });
    document.querySelectorAll("[data-remove-row]").forEach(btn => { btn.onclick = () => { const [aIdx, rIdx] = btn.dataset.removeRow.split(":").map(Number); if (state.appendices[aIdx].rows.length > 1) state.appendices[aIdx].rows.splice(rIdx, 1); renderApp(); }; });
    document.querySelectorAll("[data-calc-row]").forEach(inp => { inp.oninput = () => recalcRowLive(parseInt(inp.dataset.calcRow)); });
    const rentalDaysEl = document.getElementById("rentalDays");
    if (rentalDaysEl) rentalDaysEl.oninput = recalcRentalLive;
  }
  if (currentStep === 4) { const genBtn = document.getElementById("generateBtn"); if (genBtn) genBtn.onclick = handleGenerate; }
}

function saveCurrentStep() {
  if (currentStep === 1) {
    document.querySelectorAll("[data-contractor-field]").forEach(inp => { state.contractor[inp.dataset.contractorField] = inp.value; });
    state.notEmployeeConfirmed = document.getElementById("notEmployeeCheck").checked;
  }
  if (currentStep === 2) {
    state.contractNumber = document.getElementById("contractNumber").value;
    state.contractDate = document.getElementById("contractDate").value;
    state.polozhenieClause = document.getElementById("polozhenieClause").value;
    document.querySelectorAll("[data-body-field]").forEach(inp => { state.bodyValues[inp.dataset.bodyField] = inp.value; });
    state.vatClause = document.getElementById("vatClause").value;
  }
  if (currentStep === 3) {
    document.querySelectorAll("[data-appendix-idx]").forEach(inp => { const aIdx = parseInt(inp.dataset.appendixIdx); state.appendices[aIdx].values[inp.dataset.appendixField] = inp.value; });
    document.querySelectorAll("[data-a]").forEach(inp => { const a = parseInt(inp.dataset.a), r = parseInt(inp.dataset.r), f = inp.dataset.f; state.appendices[a].rows[r][f] = inp.value; });
    if (state.contractType === "rental_400") {
      const daysEl = document.getElementById("rentalDays");
      state.rental = { startDate: state.bodyValues.rental_start_date, endDate: state.bodyValues.rental_end_date, days: daysEl ? (parseInt(daysEl.value) || 1) : 1 };
    }
  }
}

async function handleGenerate() {
  const siteUrl = window.location.origin;
  const resultBox = document.getElementById("resultBox");
  const btn = document.getElementById("generateBtn");
  const config = currentConfig(); const grant = GRANTS[state.grantId];
  let payload;
  try { payload = buildPayload(state, config, grant); } catch (e) { resultBox.style.display = "block"; resultBox.className = "error"; resultBox.textContent = "❌ " + e.message; return; }
  btn.disabled = true; btn.textContent = "Генерирую..."; resultBox.style.display = "none";
  try {
    const res = await fetch(`${siteUrl}/.netlify/functions/generate-contract`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    resultBox.style.display = "block";
    if (res.ok) {
      const blob = await res.blob(); const url = window.URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href = url; a.download = payload.fileName;
      document.body.appendChild(a); a.click(); a.remove(); window.URL.revokeObjectURL(url);
      resultBox.className = "success";
      resultBox.textContent = "✅ Готово! Файл " + payload.fileName + " должен был начать скачиваться.\n\nПроверьте папку «Загрузки» и вручную перенесите файл в нужную папку на Google Диске.";
    } else {
      const text = await res.text();
      resultBox.className = "error"; resultBox.textContent = "❌ ОШИБКА\n\nHTTP статус: " + res.status + "\n\n" + text;
    }
  } catch (err) {
    resultBox.style.display = "block"; resultBox.className = "error"; resultBox.textContent = "❌ Не удалось отправить запрос.\n\n" + err.message;
  } finally { btn.disabled = false; btn.textContent = "Сгенерировать и скачать договор"; }
}

document.querySelectorAll(".nav-item[data-page]").forEach(el => {
  el.onclick = () => goToPage(el.dataset.page);
});
document.getElementById("app").addEventListener("input", (e) => {
  if (e.target.classList && e.target.classList.contains("field-error")) {
    const filled = e.target.type === "checkbox" ? e.target.checked : (e.target.value && e.target.value.trim());
    if (filled) e.target.classList.remove("field-error");
  }
});

// ============================================================
// FIREBASE — ВХОД И ХРАНЕНИЕ ЗАДАЧ/ПЛАНИРОВАНИЯ
// ============================================================
let firebaseConfig = null;
try { firebaseConfig = JSON.parse(window.localStorage.getItem("firebaseConfig") || "null"); } catch (e) {}
let fbApp = null, fbAuth = null, fbDb = null;

function initFirebase() {
  if (!firebaseConfig || fbApp) return;
  fbApp = firebase.initializeApp(firebaseConfig);
  fbAuth = firebase.auth();
  fbDb = firebase.firestore();
}

// Firebase Auth требует email - у нас же принято работать с простыми
// логинами (напр. "admin"), поэтому логин без "@" превращаем в
// псевдо-почту вида "admin@workspace.local" - это стандартный, безопасный
// приём, реальная почта коллегам не нужна.
function loginToEmail(login) {
  const trimmed = String(login).trim();
  return trimmed.includes("@") ? trimmed : `${trimmed}@workspace.local`;
}

let currentUser = null; // { uid, username, role, allowedSubsidies, allowedPages }

function pageAllowed(page) {
  if (!currentUser) return false;
  if (currentUser.allowedPages === "all") return true;
  return currentUser.allowedPages.split(",").map(s => s.trim()).includes(page);
}
function subsidyAllowedForUser(subsidyId) {
  if (!currentUser) return false;
  if (currentUser.allowedSubsidies === "all") return true;
  return currentUser.allowedSubsidies.split(",").map(s => s.trim()).includes(subsidyId);
}
function visibleSubsidiesForUser() {
  return subsidies.filter(s => subsidyAllowedForUser(s.id));
}

function renderLoginScreen() {
  const loginEl = document.getElementById("loginScreen");
  document.getElementById("appContainer").style.display = "none";
  loginEl.style.display = "block";

  if (!firebaseConfig) {
    loginEl.innerHTML = `
      <div class="card">
        <h2>Первоначальная настройка Firebase</h2>
        <p class="hint">В консоли Firebase (console.firebase.google.com) → Project settings → Your apps → скопируйте объект конфигурации (firebaseConfig) и вставьте его сюда целиком.</p>
        <label>Конфигурация Firebase (JSON)</label>
        <textarea id="setupFirebaseInput" style="min-height:140px;font-family:monospace;font-size:12px" placeholder='{"apiKey": "...", "authDomain": "...", "projectId": "...", ...}'></textarea>
        <button class="btn btn-primary" style="margin-top:14px" id="setupFirebaseSaveBtn">Сохранить</button>
        <div id="setupFirebaseStatus" style="margin-top:8px;font-size:13px"></div>
      </div>`;
    document.getElementById("setupFirebaseSaveBtn").onclick = () => {
      const raw = document.getElementById("setupFirebaseInput").value.trim();
      const statusEl = document.getElementById("setupFirebaseStatus");
      try {
        const parsed = JSON.parse(raw);
        firebaseConfig = parsed;
        window.localStorage.setItem("firebaseConfig", JSON.stringify(parsed));
        renderLoginScreen();
      } catch (e) {
        statusEl.textContent = "❌ Не похоже на корректный JSON. Скопируйте объект целиком, как есть, из консоли Firebase.";
      }
    };
    return;
  }

  initFirebase();

  loginEl.innerHTML = `
    <div class="card">
      <h2>Вход в WorkSpace</h2>
      <label>Логин</label>
      <input type="text" id="loginUsername">
      <label>Пароль</label>
      <input type="password" id="loginPassword">
      <button class="btn btn-primary" style="margin-top:14px;width:100%" id="loginSubmitBtn">Войти</button>
      <div id="loginStatus" style="margin-top:10px;font-size:13px"></div>
      <div class="hint" style="margin-top:14px;cursor:pointer;text-decoration:underline" id="changeFirebaseConfigLink">Изменить настройки Firebase</div>
    </div>`;

  document.getElementById("loginSubmitBtn").onclick = handleLogin;
  document.getElementById("loginPassword").onkeydown = (e) => { if (e.key === "Enter") handleLogin(); };
  document.getElementById("changeFirebaseConfigLink").onclick = () => {
    firebaseConfig = null;
    window.localStorage.removeItem("firebaseConfig");
    renderLoginScreen();
  };
}

async function handleLogin() {
  const username = document.getElementById("loginUsername").value.trim();
  const password = document.getElementById("loginPassword").value;
  const statusEl = document.getElementById("loginStatus");
  if (!username || !password) { statusEl.textContent = "Впишите логин и пароль."; return; }

  statusEl.textContent = "Проверяю...";
  try {
    const cred = await fbAuth.signInWithEmailAndPassword(loginToEmail(username), password);
    const profileSnap = await fbDb.collection("users").doc(cred.user.uid).get();
    if (!profileSnap.exists) {
      statusEl.textContent = "❌ Учётная запись есть, но нет профиля с правами доступа. Обратитесь к администратору.";
      await fbAuth.signOut();
      return;
    }
    const profile = profileSnap.data();
    currentUser = { uid: cred.user.uid, username, role: profile.role || "user", allowedSubsidies: profile.allowedSubsidies || "all", allowedPages: profile.allowedPages || "all" };
    showApp();
  } catch (err) {
    statusEl.textContent = "❌ Неверный логин или пароль.";
  }
}

function handleLogout() {
  if (fbAuth) fbAuth.signOut();
  currentUser = null;
  renderLoginScreen();
}

function showApp() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("appContainer").style.display = "flex";

  // Скрываем в меню разделы, недоступные текущему пользователю; если
  // текущая страница вдруг недоступна - переключаемся на первую доступную.
  document.querySelectorAll(".nav-item[data-page]").forEach(el => {
    const allowed = pageAllowed(el.dataset.page);
    el.style.display = allowed ? "" : "none";
  });
  if (!pageAllowed(currentPage)) {
    const firstAllowed = ["dashboard", "generator", "smeta", "planning", "documents", "settings"].find(pageAllowed);
    currentPage = firstAllowed || "generator";
  }

  // На момент первой инициализации smetaState/planningSelectedSubsidyId
  // currentUser ещё не был известен, поэтому дефолтная субсидия могла
  // выбраться без учёта прав - пересчитываем её здесь, когда права уже известны.
  const visible = visibleSubsidiesForUser();
  if (!visible.some(s => s.id === smetaState.selectedSubsidyId)) {
    smetaState.selectedSubsidyId = visible[0] ? visible[0].id : null;
    smetaState.selectedProjectId = null;
  }
  if (!visible.some(s => s.id === planningSelectedSubsidyId)) {
    planningSelectedSubsidyId = visible[0] ? visible[0].id : null;
    planningSelectedProjectId = null;
  }
  if (!subsidyAllowedForUser(state.grantId)) {
    const firstAllowedGrant = Object.keys(GRANTS).find(subsidyAllowedForUser);
    if (firstAllowedGrant) state.grantId = firstAllowedGrant;
  }

  document.getElementById("logoutNavItem").onclick = handleLogout;
  document.getElementById("pageSubtitle").textContent = PAGE_SUBTITLES[currentPage] || PAGE_SUBTITLES.generator;
  renderSidebar();
  renderStepsNav();
  renderApp();
}

// Стартовая точка: если Firebase уже настроен, ждём восстановления сессии
// (Firebase сам помнит вход между перезагрузками страницы); если нет -
// сразу показываем экран первоначальной настройки/входа.
if (firebaseConfig) {
  initFirebase();
  fbAuth.onAuthStateChanged(async (user) => {
    if (user && !currentUser) {
      const profileSnap = await fbDb.collection("users").doc(user.uid).get();
      if (profileSnap.exists) {
        const profile = profileSnap.data();
        const username = user.email.endsWith("@workspace.local") ? user.email.replace("@workspace.local", "") : user.email;
        currentUser = { uid: user.uid, username, role: profile.role || "user", allowedSubsidies: profile.allowedSubsidies || "all", allowedPages: profile.allowedPages || "all" };
        showApp();
        return;
      }
    }
    if (!user) renderLoginScreen();
  });
} else {
  renderLoginScreen();
}

</script>

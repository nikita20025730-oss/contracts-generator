async function generateDocxFromTemplate(templateFile, data, fileNameBase, statusEl) {
  if (typeof window.docxtemplater === "undefined" || typeof window.PizZip === "undefined") {
    statusEl.textContent = "❌ Не удалось загрузить библиотеку для создания Word-файла.";
    return;
  }
  statusEl.textContent = "Готовлю файл...";
  try {
    const res = await fetch(`${window.location.origin}/templates/${templateFile}`);
    if (!res.ok) throw new Error(`Шаблон не найден по адресу /templates/${templateFile} (код ${res.status})`);
    const arrayBuffer = await res.arrayBuffer();
    const zip = new window.PizZip(arrayBuffer);
    const doc = new window.docxtemplater(zip, { paragraphLoop: true, linebreaks: true, nullGetter: () => "" });
    doc.render(data);
    const blob = doc.getZip().generate({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `${fileNameBase}.docx`;
    document.body.appendChild(a); a.click(); a.remove();
    window.URL.revokeObjectURL(url);
    statusEl.textContent = "✅ Файл скачан.";
  } catch (err) {
    statusEl.textContent = "❌ " + err.message;
  }
}

// ============================================================
// СТРАНИЦА «ДАШБОРД» — списки и задачи
// ============================================================
let tasksCache = null; // массив задач, загруженных из Firestore
let tasksLoaded = false;
let knownListsCache = []; // [{ name, color, description }], загружено из Firestore
// (dashboardShowAll убран — "Мои списки" теперь всегда показывают все
// задачи внутри своих списков, "Назначенные" — всегда только свои)

const LIST_COLORS = ["#dc2626", "#ea580c", "#d97706", "#65a30d", "#059669", "#0891b2", "#2563eb", "#7c3aed", "#c026d3", "#6b7280"];

// ============================================================
// ХРАНЕНИЕ СПИСКОВ - один документ на список, а не общий массив
// ============================================================
// РАНЬШЕ все списки хранились ОДНИМ документом с массивом внутри, и любое
// сохранение перезаписывало этот массив целиком. В сочетании с живым
// обновлением (onSnapshot) это создавало гонку: если локальные данные в
// момент сохранения хоть немного разошлись с сервером (напр. кто-то другой
// только что что-то поменял), перезапись массива могла случайно СТЕРЕТЬ
// чужие изменения или целые списки. Теперь у каждого списка - свой
// отдельный документ в коллекции "taskListsV2", и любое изменение одного
// списка физически не может задеть остальные.
//
// Удаление - "мягкое" (помечаем deleted:true, не стираем документ), чтобы
// можно было восстановить случайно удалённый список.
const LISTS_COLLECTION = "taskListsV2";

function generateListId() {
  return "list_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
}

async function loadKnownLists() {
  try {
    const snap = await fbDb.collection(LISTS_COLLECTION).get();
    knownListsCache = snap.docs
      .map(d => ({ id: d.id, color: LIST_COLORS[0], description: "", ...d.data() }))
      .filter(l => !l.deleted);
  } catch (e) {
    knownListsCache = [];
  }
}

// ВАЖНО: названия списков теперь МОГУТ повторяться - уникальность
// определяется отдельным полем id (генерируется один раз при создании и
// никогда не меняется, даже при переименовании), а не текстом названия.
// Задачи ссылаются на список через listId, а не через текст названия -
// поэтому переименование или дубль имени больше не может "потерять" задачи.
async function addKnownList(name, color, description) {
  const id = generateListId();
  const list = { name, color: color || LIST_COLORS[0], description: description || "", createdBy: currentUser.username, deleted: false };
  knownListsCache.push({ ...list, id });
  await fbDb.collection(LISTS_COLLECTION).doc(id).set(list);
  return id;
}

async function updateKnownList(id, updates) {
  const list = knownListsCache.find(l => l.id === id);
  if (!list) return;
  Object.assign(list, updates);
  const { id: _id, ...dataToSave } = list;
  await fbDb.collection(LISTS_COLLECTION).doc(id).set(dataToSave);
}

// Мягкое удаление - список помечается удалённым, но документ остаётся в
// базе, поэтому его можно вернуть через "Восстановить удалённый список".
async function softDeleteKnownList(id) {
  await fbDb.collection(LISTS_COLLECTION).doc(id).update({ deleted: true });
  knownListsCache = knownListsCache.filter(l => l.id !== id);
}

async function loadDeletedLists() {
  try {
    const snap = await fbDb.collection(LISTS_COLLECTION).where("deleted", "==", true).get();
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) {
    return [];
  }
}
async function restoreDeletedList(id) {
  await fbDb.collection(LISTS_COLLECTION).doc(id).update({ deleted: false });
}

// Разовый "ремонт" списков - на случай, если какие-то записи в базе
// остались от более старой схемы хранения (до перехода на устойчивые ID и
// явного владельца) и не имеют поля createdBy - без него список считается
// "ничьим" и по этой причине показывается ВСЕМ пользователям как "мой".
// Присваивает владельцем текущего человека (запускающего ремонт) - если
// список на самом деле принадлежит кому-то другому, это легко поправить
// вручную через "Изменить список" после ремонта.
async function repairListOwnership() {
  await loadKnownLists(); // берём самое свежее состояние из базы, не кэш
  const broken = knownListsCache.filter(l => !l.createdBy || !l.id);
  const fixedNames = [];
  for (const list of broken) {
    if (!list.createdBy) { list.createdBy = currentUser.username; fixedNames.push(list.name); }
    const { id, ...dataToSave } = list;
    await fbDb.collection(LISTS_COLLECTION).doc(id).set(dataToSave);
  }

  // "Призрачные" списки - существуют только как текст внутри задач (списки,
  // заведённые ещё до перехода на текущую систему хранения), у них вообще
  // нет записи в базе списков. Материализуем каждый - без этого их нельзя
  // отредактировать, хотя задачи в них прекрасно видны на дашборде.
  const orphanNames = [...new Set(
    tasksCache.filter(t => !t.listId && !knownListsCache.some(l => l.name === t.list)).map(t => t.list)
  )];
  for (const name of orphanNames) {
    const id = generateListId();
    const list = { id, name, color: LIST_COLORS[0], description: "", createdBy: currentUser.username, deleted: false };
    knownListsCache.push(list);
    const { id: _id, ...dataToSave } = list;
    await fbDb.collection(LISTS_COLLECTION).doc(id).set(dataToSave);
    fixedNames.push(name);
  }

  return fixedNames;
}

// Переименование списка - теперь тривиально: id (и, значит, ссылки на
// список во всех задачах через listId) не меняется при переименовании,
// поэтому просто правим поле name у того же документа. Задачи, созданные
// ДО перехода на listId (у них есть только текстовое поле list), всё ещё
// обновляем по старому названию - для обратной совместимости.
async function renameKnownList(id, newName) {
  const list = knownListsCache.find(l => l.id === id);
  if (!list) return { success: false, error: "Список не найден." };
  const oldName = list.name;
  if (oldName === newName) return { success: true };

  // ВАЖНО: находим задачи ДО переименования - taskBelongsToList для старых
  // задач (без listId) сверяет по ТЕКУЩЕМУ имени списка, поэтому если
  // сначала переименовать список, они перестанут находиться.
  const affectedTasks = tasksCache.filter(t => taskBelongsToList(t, list));

  list.name = newName;
  await updateKnownList(id, { name: newName });

  // Обновляем текстовое поле list ("снимок" названия для отображения и
  // обратной совместимости) у ВСЕХ задач этого списка - хотя фактическая
  // принадлежность определяется через listId, лучше не оставлять нигде
  // устаревший текст названия.
  for (const task of affectedTasks) {
    task.list = newName;
    await fbDb.collection("tasks").doc(task.id).update({ list: newName });
  }
  return { success: true };
}

// Сопоставление задачи и списка - сначала по стабильному listId (новые
// задачи), а если его нет (старые задачи, заведённые до этого перехода) -
// по совпадению текста названия, как раньше.
function taskBelongsToList(task, list) {
  if (task.listId) return task.listId === list.id;
  return task.list === list.name;
}
function findListForTask(task) {
  if (task.listId) return knownListsCache.find(l => l.id === task.listId);
  return knownListsCache.find(l => l.name === task.list);
}

// Типы задач: "assigned" (назначенная одному человеку), "shared" (общая -
// несколько исполнителей сразу), "personal" (собственная - видна только
// автору, даже владельцу списка). У старых задач (заведённых до введения
// типов) taskType не задан - считаем их "assigned", как раньше.

// Видна ли задача пользователю ВООБЩЕ (в списке, для общего обзора) -
// собственные задачи ЧУЖИХ людей скрыты даже от владельца списка.
function taskVisibleToUser(task, username) {
  if (task.taskType === "personal") return sameUsername(task.assignee, username);
  return true;
}
// Участвует ли пользователь как исполнитель - для "общей" задачи это
// любой из массива assignees, для остальных типов - единственный assignee.
function isUserInTaskAssignees(task, username) {
  if (task.taskType === "shared") return (task.assignees || []).some(a => sameUsername(a, username));
  return sameUsername(task.assignee, username);
}

// ============================================================
// КАЛЕНДАРЬ
// ============================================================
// Событие: { id, title, date (YYYY-MM-DD), time (HH:MM, необязательно),
//   place, color, projectListName (необязательно - к какому списку/проекту
//   относится), visibility: "personal" | "shared", createdBy,
//   sharedWith: [username, ...] (для visibility="shared") }
let calendarEventsCache = [];
let calendarEventsLoaded = false;
let calendarUnsubscribe = null;

// Событие видно мне, если: это я его создал(а), ЛИБО оно общее и я в
// списке допущенных.
function canSeeCalendarEvent(ev) {
  if (sameUsername(ev.createdBy, currentUser.username)) return true;
  if (ev.visibility === "shared" && (ev.sharedWith || []).some(u => sameUsername(u, currentUser.username))) return true;
  return false;
}
function visibleCalendarEvents() {
  return calendarEventsCache.filter(canSeeCalendarEvent);
}

async function addCalendarEvent(data) {
  const id = "ev_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
  const event = { id, createdBy: currentUser.username, ...data };
  calendarEventsCache.push(event);
  await fbDb.collection("calendarEvents").doc(id).set(event);
}
async function updateCalendarEvent(id, updates) {
  const ev = calendarEventsCache.find(e => e.id === id);
  if (ev) Object.assign(ev, updates);
  await fbDb.collection("calendarEvents").doc(id).update(updates);
}
async function deleteCalendarEvent(id) {
  calendarEventsCache = calendarEventsCache.filter(e => e.id !== id);
  await fbDb.collection("calendarEvents").doc(id).delete();
}
async function loadCalendarEvents() {
  try {
    const snap = await fbDb.collection("calendarEvents").get();
    calendarEventsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) {
    calendarEventsCache = [];
  }
  calendarEventsLoaded = true;
}

// ============================================================
// Вместо однократной загрузки (fetch раз при открытии страницы) держим
// постоянно открытое соединение с Firestore (onSnapshot). Как только
// кто-то (вы на другом устройстве, или коллега) меняет задачу или
// список - изменения мгновенно прилетают сюда и экран сам перерисовывается,
// без необходимости обновлять страницу вручную.
let tasksUnsubscribe = null;
let listsUnsubscribe = null;

function startRealtimeSync() {
  if (tasksUnsubscribe) return; // уже подключено - не плодим второй слушатель

  tasksUnsubscribe = fbDb.collection("tasks").onSnapshot(
    (snap) => {
      tasksCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (currentPage === "dashboard") renderApp();
    },
    (err) => { console.error("Синхронизация задач прервана:", err.message); }
  );

  listsUnsubscribe = fbDb.collection(LISTS_COLLECTION).onSnapshot(
    (snap) => {
      knownListsCache = snap.docs
        .map(d => ({ id: d.id, color: LIST_COLORS[0], description: "", ...d.data() }))
        .filter(l => !l.deleted);
      if (currentPage === "dashboard") renderApp();
    },
    (err) => { console.error("Синхронизация списков прервана:", err.message); }
  );

  calendarUnsubscribe = fbDb.collection("calendarEvents").onSnapshot(
    (snap) => {
      calendarEventsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      calendarEventsLoaded = true;
      if (currentPage === "dashboard") renderApp();
    },
    (err) => { console.error("Синхронизация календаря прервана:", err.message); }
  );
}
function stopRealtimeSync() {
  if (tasksUnsubscribe) { tasksUnsubscribe(); tasksUnsubscribe = null; }
  if (listsUnsubscribe) { listsUnsubscribe(); listsUnsubscribe = null; }
  if (calendarUnsubscribe) { calendarUnsubscribe(); calendarUnsubscribe = null; }
  reminderCheckIntervalId && clearInterval(reminderCheckIntervalId);
  reminderCheckIntervalId = null;
}

// ============================================================
// НАПОМИНАНИЯ О СОБЫТИЯХ
// ============================================================
// Пока приложение открыто (вкладка/окно), раз в 30 секунд проверяем, не
// подошло ли время напомнить о каком-то событии. Полноценные push-
// уведомления (когда приложение полностью закрыто) - следующий шаг,
// требующий отдельной инфраструктуры (сервис-воркер) - обсуждали отдельно.
let reminderCheckIntervalId = null;
let notificationPermissionRequested = false;

function requestNotificationPermissionOnce() {
  if (notificationPermissionRequested) return;
  notificationPermissionRequested = true;
  if (typeof Notification !== "undefined" && Notification.permission === "default") {
    Notification.requestPermission();
  }
}

function showInAppReminderBanner(ev) {
  const banner = document.createElement("div");
  banner.style.cssText = "position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;background:var(--card-bg);border:1px solid var(--accent);border-radius:10px;padding:12px 18px;box-shadow:0 4px 16px rgba(0,0,0,0.2);max-width:90vw;font-size:14px";
  banner.innerHTML = `<b>Скоро событие:</b> ${ev.title}${ev.time ? " в " + ev.time : ""}${ev.place ? " · " + ev.place : ""}`;
  document.body.appendChild(banner);
  setTimeout(() => banner.remove(), 8000);
}

function checkEventReminders() {
  if (!currentUser || !calendarEventsLoaded) return;
  const now = new Date();
  visibleCalendarEvents().forEach(ev => {
    if (!ev.reminderMinutes || !ev.time || ev.reminderNotified) return;
    const eventDateTime = new Date(`${ev.date}T${ev.time}:00`);
    const remindAt = new Date(eventDateTime.getTime() - ev.reminderMinutes * 60000);
    if (now >= remindAt && now < eventDateTime) {
      const message = `${ev.title}${ev.place ? " — " + ev.place : ""} в ${ev.time}`;
      if (typeof Notification !== "undefined" && Notification.permission === "granted") {
        new Notification("Скоро событие", { body: message, icon: "/icons/icon-192.png" });
      } else {
        showInAppReminderBanner(ev);
      }
      updateCalendarEvent(ev.id, { reminderNotified: true });
    }
  });
}

async function loadTasks() {
  try {
    const snap = await fbDb.collection("tasks").get();
    tasksCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) {
    tasksCache = [];
  }
  await loadKnownLists();
  await loadCalendarEvents();
  if (!usersDirectoryLoaded) await loadUsersDirectory();
  tasksLoaded = true;
  startRealtimeSync(); // с этого момента данные обновляются сами, без перезагрузки
  requestNotificationPermissionOnce();
  if (!reminderCheckIntervalId) reminderCheckIntervalId = setInterval(checkEventReminders, 30000);
  checkEventReminders(); // сразу же одна проверка, не дожидаясь первого интервала
}

// Регистронезависимое сравнение логинов - защита на случай уже
// сохранённых задач, где значение assignee могло разойтись в регистре
// (см. исправленный баг в handleLogin про несовпадение логина между сессиями).
function sameUsername(a, b) {
  return String(a || "").trim().toLowerCase() === String(b || "").trim().toLowerCase();
}

function displayNameFor(username) {
  const entry = usersDirectoryCache.find(u => u.username === username);
  return (entry && entry.fullName) ? entry.fullName : username;
}
function assigneeOptionsHtml(selected) {
  return usersDirectoryCache.map(u =>
    `<option value="${u.username}" ${u.username===selected?'selected':''}>${u.fullName || u.username}</option>`
  ).join("");
}

const TASK_STATUSES = ["Не начато", "В работе", "Готово"];
function nextStatus(status) {
  const idx = TASK_STATUSES.indexOf(status);
  return TASK_STATUSES[(idx + 1) % TASK_STATUSES.length];
}
function statusColor(status, listColor) {
  if (status === "Готово") return { bg: "var(--nav-hover)", color: "var(--text-secondary)" };
  if (status === "В работе") return { bg: hexToRgba(listColor || "#2563eb", 0.15), color: listColor || "#2563eb" };
  return { bg: "var(--nav-hover)", color: "var(--text-secondary)" };
}
function hexToRgba(hex, alpha) {
  const h = hex.replace("#", "");
  const r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function todayRuFormatted() {
  const d = new Date();
  return d.toLocaleDateString("ru-RU", { day: "numeric", month: "long", weekday: "long" });
}
// Возвращает сегодняшнюю дату в формате YYYY-MM-DD - именно в этом формате
// работает <input type="date">, поэтому храним даты в задачах так же, для
// единообразия и удобного сравнения строками.
function todayISO() {
  return new Date().toISOString().slice(0, 10);
}
function isoToRuDate(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `${d}.${m}.${y}`;
}

// ============================================================
// ВИДЖЕТ КАЛЕНДАРЯ (месячная сетка на дашборде)
// ============================================================
const now0 = new Date();
let calendarViewMonth = now0.getMonth(); // 0-indexed
let calendarViewYear = now0.getFullYear();
let calendarSelectedDay = todayISO(); // какой день сейчас раскрыт снизу сетки

function renderCalendarWidget() {
  const events = visibleCalendarEvents();
  const eventsByDay = {};
  events.forEach(ev => { (eventsByDay[ev.date] = eventsByDay[ev.date] || []).push(ev); });

  const firstDay = new Date(calendarViewYear, calendarViewMonth, 1);
  const startWeekday = (firstDay.getDay() + 6) % 7; // делаем понедельник первым днём недели
  const daysInMonth = new Date(calendarViewYear, calendarViewMonth + 1, 0).getDate();
  const todayIso = todayISO();

  let cells = "";
  for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-cell cal-cell-empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const iso = `${calendarViewYear}-${String(calendarViewMonth + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const dayEvents = eventsByDay[iso] || [];
    const dots = dayEvents.slice(0, 4).map(ev => `<span class="cal-dot" style="background:${ev.color || "#dc2626"}"></span>`).join("");
    const classes = ["cal-cell"];
    if (iso === todayIso) classes.push("cal-today");
    if (iso === calendarSelectedDay) classes.push("cal-cell-selected");
    cells += `<div class="${classes.join(" ")}" data-cal-day="${iso}">
      <div class="cal-day-num">${d}</div>
      <div class="cal-dots">${dots}</div>
    </div>`;
  }

  const selectedDayEvents = (eventsByDay[calendarSelectedDay] || []).sort((a, b) => (a.time || "").localeCompare(b.time || ""));
  const selectedDayLabel = calendarSelectedDay ? `${parseInt(calendarSelectedDay.slice(8, 10))} ${MONTH_NAMES_GENITIVE[parseInt(calendarSelectedDay.slice(5, 7)) - 1]}` : "";
  const dayDetailHtml = calendarSelectedDay ? `
    <div class="cal-day-detail">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <b>${selectedDayLabel}</b>
        <button class="btn btn-secondary btn-small" data-cal-add-event="${calendarSelectedDay}">+ Событие</button>
      </div>
      ${selectedDayEvents.length ? selectedDayEvents.map(ev => `
        <div class="cal-event-row">
          <span class="cal-event-color-dot" style="background:${ev.color || "#dc2626"}"></span>
          <div style="flex:1">
            ${ev.time ? `<b>${ev.time}</b> ` : ""}${ev.title}
            ${ev.place ? `<span class="hint"> · ${ev.place}</span>` : ""}
            ${ev.projectListName ? `<span class="hint"> · ${ev.projectListName}</span>` : ""}
            ${ev.visibility === "shared" ? `<span class="hint"> · общее</span>` : ""}
          </div>
          <button class="icon-btn" data-cal-edit-event="${ev.id}" title="Изменить"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
        </div>`).join("") : `<div class="hint" style="padding:8px 0">Событий нет.</div>`}
    </div>` : "";

  // Отдельный список "Ближайшие события" (следующие 14 дней, не считая
  // текущий раскрытый день) - чтобы события были видны сразу текстом, а не
  // требовали угадывать/кликать нужный день по едва заметной точке в сетке.
  // Именно отсутствие такого списка раньше создавало впечатление, что
  // общие события "не отображаются", хотя на самом деле они были видны
  // точкой-маркером - просто не в развёрнутом виде.
  const upcomingCutoff = new Date(todayIso + "T00:00:00");
  upcomingCutoff.setDate(upcomingCutoff.getDate() + 14);
  const upcomingCutoffIso = upcomingCutoff.toISOString().slice(0, 10);
  const upcomingEvents = events
    .filter(ev => ev.date >= todayIso && ev.date <= upcomingCutoffIso)
    .sort((a, b) => (a.date + (a.time||"")).localeCompare(b.date + (b.time||"")));
  const upcomingHtml = upcomingEvents.length ? `
    <div class="cal-day-detail" style="margin-top:10px">
      <b style="font-size:12px;color:var(--text-secondary)">Ближайшие события (14 дней)</b>
      ${upcomingEvents.map(ev => `
        <div class="cal-event-row" data-cal-jump-to-day="${ev.date}" style="cursor:pointer">
          <span class="cal-event-color-dot" style="background:${ev.color || "#dc2626"}"></span>
          <div style="flex:1">
            <b>${isoToRuDate(ev.date)}</b>${ev.time ? ` ${ev.time}` : ""} — ${ev.title}
            ${ev.visibility === "shared" ? `<span class="hint"> · общее</span>` : ""}
          </div>
        </div>`).join("")}
    </div>` : "";

  return `<div class="calendar-widget">
    <div class="cal-header">
      <button class="icon-btn" id="calPrevMonth">‹</button>
      <div>${MONTH_NAMES[calendarViewMonth]} ${calendarViewYear}</div>
      <button class="icon-btn" id="calNextMonth">›</button>
    </div>
    <div class="cal-weekdays">${["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(d => `<div>${d}</div>`).join("")}</div>
    <div class="cal-grid">${cells}</div>
    ${dayDetailHtml}
    ${upcomingHtml}
  </div>`;
}

// Формирует и сразу скачивает .ics-файл события - для тех, у кого нет
// автоматической синхронизации с iCloud (см. calendarEventFormModalHtml).
// Файл открывается любым календарём на телефоне (не только Apple) -
// достаточно один раз коснуться скачанного файла.
function downloadEventAsIcs(ev) {
  const pad = (n) => String(n).padStart(2, "0");
  const [y, m, d] = ev.date.split("-").map(Number);
  let dtStart, dtEnd;
  if (!ev.time) {
    dtStart = `${y}${pad(m)}${pad(d)}`;
    const endDate = new Date(y, m - 1, d + 1);
    dtEnd = `${endDate.getFullYear()}${pad(endDate.getMonth()+1)}${pad(endDate.getDate())}`;
  } else {
    const [hh, mm] = ev.time.split(":").map(Number);
    const startUtc = new Date(Date.UTC(y, m - 1, d, hh - 3, mm)); // МСК -> UTC
    const endUtc = new Date(startUtc.getTime() + 60 * 60000);
    const fmt = (dt) => `${dt.getUTCFullYear()}${pad(dt.getUTCMonth()+1)}${pad(dt.getUTCDate())}T${pad(dt.getUTCHours())}${pad(dt.getUTCMinutes())}00Z`;
    dtStart = fmt(startUtc); dtEnd = fmt(endUtc);
  }
  const now = new Date();
  const stamp = `${now.getUTCFullYear()}${pad(now.getUTCMonth()+1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}${pad(now.getUTCSeconds())}Z`;
  const esc = (s) => String(s || "").replace(/[,;\\]/g, (c) => "\\" + c);
  const lines = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//WorkSpace//RU", "BEGIN:VEVENT",
    `UID:workspace-${Date.now()}@workspace`, `DTSTAMP:${stamp}`,
    ev.time ? `DTSTART:${dtStart}` : `DTSTART;VALUE=DATE:${dtStart}`,
    ev.time ? `DTEND:${dtEnd}` : `DTEND;VALUE=DATE:${dtEnd}`,
    `SUMMARY:${esc(ev.title)}`,
  ];
  if (ev.place) lines.push(`LOCATION:${esc(ev.place)}`);
  lines.push("END:VEVENT", "END:VCALENDAR");

  const blob = new Blob([lines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `${ev.title.replace(/[\\/:*?"<>|]/g, "_")}.ics`;
  document.body.appendChild(a); a.click(); a.remove();
  window.URL.revokeObjectURL(url);
}

// Сколько дней осталось до дедлайна (может быть отрицательным, если срок
// уже прошёл). Считаем по календарным дням, не по часам, чтобы не путаться
// с разницей во времени суток.
function daysUntilDeadline(dueDateIso) {
  if (!dueDateIso) return null;
  const today = new Date(todayISO() + "T00:00:00");
  const due = new Date(dueDateIso + "T00:00:00");
  return Math.round((due - today) / 86400000);
}
// Подсветка строки задачи по близости дедлайна - чем ближе срок, тем
// тревожнее цвет; дедлайн сегодня - красный.
function deadlineHighlight(dueDateIso, status) {
  if (!dueDateIso || status === "Готово") return null;
  const days = daysUntilDeadline(dueDateIso);
  // ВАЖНО: фон подсветки всегда светлый пастельный - поэтому текст поверх
  // него должен быть ТЁМНЫМ всегда, независимо от текущей темы приложения
  // (светлая/тёмная). Раньше текст наследовал общий цвет темы (в тёмной
  // теме - белый), из-за чего на светлом фоне подсветки становился
  // нечитаемым.
  const darkText = "#3f1a12";
  if (days === 0) return { bg: "#fee2e2", text: darkText, tagBg: "#dc2626", tagColor: "#ffffff", label: "Сегодня срок" };
  if (days === 1) return { bg: "#fed7aa", text: darkText, tagBg: "#f97316", tagColor: "#ffffff", label: "1 день" };
  if (days === 2) return { bg: "#fef08a", text: darkText, tagBg: "#eab308", tagColor: "#78350f", label: "2 дня" };
  if (days === 3) return { bg: "#fef9c3", text: darkText, tagBg: "#fde047", tagColor: "#78350f", label: "3 дня" };
  return null;
}

// Инициалы для компактного "аватара" исполнителя - вместо полного имени,
// которое при длинном ФИО наезжало на соседний текст задачи.
function initialsFor(username) {
  const name = displayNameFor(username);
  const parts = name.trim().split(/\s+/).filter(Boolean);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return name.slice(0, 2).toUpperCase();
}
function avatarColorFor(username) {
  // Стабильный цвет по логину - один и тот же человек всегда получает один
  // и тот же цвет аватара, вычисляется без внешних зависимостей.
  let hash = 0;
  for (const ch of String(username || "")) hash = (hash * 31 + ch.charCodeAt(0)) % 360;
  return `hsl(${hash}, 55%, 45%)`;
}

      <button class="icon-btn" data-delete-task="${t.id}" title="Удалить"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg></button>

let dashboardShowArchive = false;
let dashboardShowHiddenTasks = false; // скрытие есть только у ЗАДАЧ (у списков убрали - путало)
let dashboardArchiveFilter = "all"; // "all" | "toMe" | "byMe" - вкладки в архиве
// Поля периода отчёта были НЕуправляемыми (без value) - живая синхронизация
// вызывает renderApp() при любом фоновом изменении где угодно, и такие поля
// стирались сами по себе, даже без участия пользователя. Теперь дата хранится
// в отдельном состоянии и переживает перерисовку.
let reportPeriodFromValue = "";
let reportPeriodToValue = "";
let reportIncludeCalendarValue = false;

// Список всех известных списков + владелец каждого - используется и при
// отрисовке дашборда, и при выгрузке отчёта, чтобы логика "какие списки
// мои" НЕ расходилась между экраном и отчётом (именно расхождение этой
// логики раньше приводило к тому, что архив показывал задачу, а отчёт
// говорил "задач нет" - отчёт использовал более узкий фильтр).
// Задачи, заведённые ДО перехода на id (есть только текстовое поле list,
// не указывающее ни на один существующий список) - синтезируем для них
// "призрачный" список без владельца, как и раньше.
function getAllListsWithOwners() {
  const orphanNames = [...new Set(
    tasksCache.filter(t => !t.listId && !knownListsCache.some(l => l.name === t.list)).map(t => t.list)
  )];
  return [...knownListsCache, ...orphanNames.map(name => ({ id: null, name, color: LIST_COLORS[0], description: "", createdBy: null }))];
}
function getMyOwnedLists() {
  return getAllListsWithOwners().filter(l => !l.createdBy || sameUsername(l.createdBy, currentUser.username));
}

function renderDashboardPage() {
  if (!tasksLoaded) return `<div class="card"><h2>Дашборд</h2><div class="hint">Загрузка...</div></div>`;

  const allLists = getAllListsWithOwners();

  // ВАЖНО: счётчик "скрытых" должен считать только то, что переключатель
  // "Показать скрытые" реально способен раскрыть - то есть СВОИ списки
  // (чужой список не появится в "Мои списки" никогда, вне зависимости от
  // скрытия, и у него даже нет кнопки редактирования на этом экране).
  const ownedLists = getMyOwnedLists(); // для проверки владения (архив, отчёт, счётчик скрытых) - без учёта "скрыт"
  const hiddenTasksCount = tasksCache.filter(t =>
    t.hidden && taskVisibleToUser(t, currentUser.username) &&
    (isUserInTaskAssignees(t, currentUser.username) || ownedLists.some(l => taskBelongsToList(t, l)))
  ).length;

  // Список карточек ("Мои списки"), которые реально показываются на экране
  // - скрытые убираем, пока не включена кнопка "Показать скрытые".
  const myLists = ownedLists;
  // Чужие списки - нужны, чтобы найти в них задачи, назначенные на меня
  // (раздел "Назначенные").
  const otherLists = allLists.filter(l => l.createdBy && !sameUsername(l.createdBy, currentUser.username));

  // Выполненные задачи ("Готово") автоматически уходят из "Сегодня" и из
  // обычных списков проекта - они видны только в архиве внизу страницы.
  // В архив попадают задачи, в которых я участвую как исполнитель, ИЛИ
  // выполненные задачи в списках, которые я создал (для общего контроля) -
  // НО собственные задачи чужих людей из архива тоже скрыты (см.
  // taskVisibleToUser), даже если список мой.
  const archivedTasks = tasksCache.filter(t =>
    t.status === "Готово" && taskVisibleToUser(t, currentUser.username) &&
    (isUserInTaskAssignees(t, currentUser.username) || ownedLists.some(l => taskBelongsToList(t, l)))
  );
  // "Сегодня" - задачи, отмеченные тумблером. В отличие от архива и списков,
  // "Сегодня" отражает ТОЛЬКО фактическое участие как исполнитель - принцип
  // "владелец списка видит всё" сюда НЕ распространяется: если задачу
  // назначили конкретному человеку, тумблер поднимает её в "Сегодня" только
  // у него, а не у владельца списка (если это разные люди). Для "общих"
  // задач - тумблер один на всех участников (isUserInTaskAssignees
  // проверяет весь список assignees).
  const todayTasks = tasksCache.filter(t =>
    t.today && t.status !== "Готово" && isUserInTaskAssignees(t, currentUser.username) &&
    (dashboardShowHiddenTasks || !t.hidden)
  );

  const renderListCard = (list, tasksInList, showAddButton) => {
    const rows = tasksInList.map(t => renderTaskRow(t, false)).join("");
    return `
    <div class="list-card" style="border-left-color:${list.color}">
      <div class="list-card-header">
        <div>
          <div class="list-card-title"><span class="list-color-dot" style="background:${list.color}"></span>${list.name}</div>
          ${list.description ? `<div class="list-card-desc">${list.description}</div>` : ""}
        </div>
        ${showAddButton !== false ? `<button class="icon-btn" data-edit-list="${list.id || ''}" data-edit-list-name="${list.name}" title="Изменить список"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>` : ""}
      </div>
      <div style="margin-top:10px">
        ${tasksInList.length ? rows : `<div class="hint">Задач пока нет.</div>`}
      </div>
      ${showAddButton !== false ? `<button class="btn btn-secondary btn-small" style="margin-top:12px" data-add-task-to-list="${list.id || ''}" data-add-task-to-list-name="${list.name}">+ Добавить задачу</button>` : ""}
    </div>`;
  };

  // "Мои списки" - это МОИ проекты, поэтому внутри них видны задачи ЛЮБОГО
  // исполнителя ("assigned"/"shared") - для общего обзора. Но "собственные"
  // задачи ЧУЖИХ людей скрыты даже здесь (taskVisibleToUser) - именно так и
  // задумано: владелец списка не должен видеть чьи-то личные пометки.
  const myListBlocks = myLists.map(list => {
    const tasksInList = tasksCache.filter(t =>
      taskBelongsToList(t, list) && t.status !== "Готово" &&
      taskVisibleToUser(t, currentUser.username) && (dashboardShowHiddenTasks || !t.hidden)
    );
    return renderListCard(list, tasksInList, true);
  }).join("");

  // "Назначенные" - задачи из ЧУЖИХ списков, в которых я участвую как
  // исполнитель (назначенная лично мне, либо общая, где я один из
  // участников).
  const assignedTasks = tasksCache.filter(t =>
    t.status !== "Готово" && isUserInTaskAssignees(t, currentUser.username) &&
    otherLists.some(l => taskBelongsToList(t, l)) && (dashboardShowHiddenTasks || !t.hidden)
  );
  const assignedBlock = assignedTasks.length || otherLists.length ? renderListCard(
    { name: "Назначенные", color: "#6b7280", description: "Задачи из чужих списков, назначенные на вас" },
    assignedTasks, false
  ) : "";

  const archiveFilteredTasks = dashboardArchiveFilter === "toMe"
    ? archivedTasks.filter(t => sameUsername(t.assignee, currentUser.username))
    : dashboardArchiveFilter === "byMe"
    ? archivedTasks.filter(t => sameUsername(t.assignedBy, currentUser.username))
    : archivedTasks;
  const archiveTabBtn = (key, label) => `<button class="btn ${dashboardArchiveFilter===key?'btn-primary':'btn-secondary'} btn-small" data-archive-filter="${key}">${label}</button>`;

async function handleExportTasksReport() {
  const statusEl = document.getElementById("exportReportStatus");
  const from = reportPeriodFromValue;
  const to = reportPeriodToValue;
  const includeCalendar = reportIncludeCalendarValue;
  if (!from || !to) { statusEl.textContent = "⚠️ Укажите обе даты периода."; return; }

  const ownedLists = getMyOwnedLists();
  const completedInPeriod = tasksCache.filter(t =>
    t.status === "Готово" && t.completedAt && t.completedAt >= from && t.completedAt <= to &&
    taskVisibleToUser(t, currentUser.username) &&
    (isUserInTaskAssignees(t, currentUser.username) || ownedLists.some(l => taskBelongsToList(t, l)))
  );
  // "Собственные" - задачи типа personal (всегда сам себе). Идут ПЕРВЫМ
  // разделом отчёта, в старом простом формате (без указания исполнителя -
  // он и так всегда автор). "Назначено МНЕ" - я участвую как исполнитель
  // в задаче ДРУГОГО типа (не собственная) - лично назначенная, или общая,
  // где я один из участников. "Назначено МНОЮ" - я поставил задачу кому-то
  // ДРУГОМУ (сам себе назначенные задачи не дублируем - показываем только
  // в "Собственные").
  const personalTasks = completedInPeriod.filter(t => t.taskType === "personal");
  const assignedToMe = completedInPeriod.filter(t => t.taskType !== "personal" && isUserInTaskAssignees(t, currentUser.username));
  const assignedByMe = completedInPeriod.filter(t => t.taskType !== "personal" && sameUsername(t.assignedBy, currentUser.username) && !isUserInTaskAssignees(t, currentUser.username));

  // Тот же фильтр вкладки, что выбран сейчас в архиве на экране (Все /
  // Назначенные мне / Назначенные мною) - определяет, какие разделы войдут
  // в отчёт. "Собственные" считаем частью "мне" (это тоже моя работа).
  const includeToMe = dashboardArchiveFilter !== "byMe";
  const includeByMe = dashboardArchiveFilter !== "toMe";

  const groupByList = (tasks, withAssigneeName) => {
    // Группируем по стабильному ключу (listId, а для старых задач без него -
    // по имени) - иначе при одинаковых названиях у РАЗНЫХ списков задачи
    // из них ошибочно слились бы в одну группу в отчёте.
    const groupKey = (t) => t.listId || `name:${t.list}`;
    const keys = [...new Set(tasks.map(groupKey))];
    return keys.map(key => {
      const tasksInGroup = tasks.filter(t => groupKey(t) === key);
      const list = findListForTask(tasksInGroup[0]);
      return {
        list_name: list ? list.name : tasksInGroup[0].list,
        tasks: tasksInGroup.sort((a, b) => a.completedAt.localeCompare(b.completedAt)).map(t => ({
          task_title: t.title, completed_date: isoToRuDate(t.completedAt),
          ...(withAssigneeName ? { task_assignee_name: t.taskType === "shared" ? (t.assignees||[]).map(displayNameFor).join(", ") : displayNameFor(t.assignee) } : {}),
        })),
      };
    });
  };
  const personalLists = includeToMe ? groupByList(personalTasks, false) : [];
  const assignedToMeLists = includeToMe ? groupByList(assignedToMe, false) : [];
  const assignedByMeLists = includeByMe ? groupByList(assignedByMe, true) : [];

  // События - из собственного календаря WorkSpace (видимые мне, в периоде),
  // плюс, если отмечена галочка, из iCloud.
  let events = visibleCalendarEvents()
    .filter(ev => ev.date >= from && ev.date <= to)
    .map(ev => ({ event_date: isoToRuDate(ev.date), event_time: ev.time || "", event_title: ev.title }));

  if (includeCalendar) {
    statusEl.textContent = "Получаю события из iCloud...";
    try {
      const res = await fetch(`${window.location.origin}/.netlify/functions/read-icloud-calendar`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ dateFrom: from, dateTo: to }),
      });
      const json = await res.json();
      if (res.ok && json.success) {
        events = events.concat(json.events.map(e => ({ event_date: isoToRuDate(e.date), event_time: e.time, event_title: e.title })));
        if (json.warning) statusEl.textContent = "⚠️ " + json.warning;
      } else {
        statusEl.textContent = "⚠️ Не удалось получить календарь iCloud: " + (json.error || "неизвестная ошибка") + ". Отчёт будет собран без него.";
      }
    } catch (err) {
      statusEl.textContent = "⚠️ Не удалось связаться с сервером для календаря. Отчёт будет собран без него.";
    }
  }

  if (!personalLists.length && !assignedToMeLists.length && !assignedByMeLists.length && !events.length) {
    statusEl.textContent = "⚠️ За выбранный период нечего включить в отчёт.";
    return;
  }

  const data = {
    period: `${isoToRuDate(from)} — ${isoToRuDate(to)}`,
    employee_name: displayNameFor(currentUser.username),
    hasPersonal: personalLists.length > 0, personalLists,
    hasAssignedToMe: assignedToMeLists.length > 0, assignedToMeLists,
    hasAssignedByMe: assignedByMeLists.length > 0, assignedByMeLists,
    hasEvents: events.length > 0, events,
  };

  await generateDocxFromTemplate("Шаблон_Отчет_по_задачам.docx", data, `Отчёт_${currentUser.username}_${from}_${to}`, statusEl);
}

function attachDashboardHandlers() {
  if (!tasksLoaded) {
    loadTasks().then(() => { if (currentPage === "dashboard") renderApp(); });
    return;
  }

  const colorPickerHtml = (selected) => `<div class="color-swatches" id="modalColorSwatches">${LIST_COLORS.map(c => `<span class="color-swatch ${c===selected?'selected':''}" style="background:${c}" data-color="${c}"></span>`).join("")}</div>`;
  const wireColorPicker = (getSelected, setSelected) => {
    document.querySelectorAll("#modalColorSwatches .color-swatch").forEach(sw => {
      sw.onclick = () => {
        setSelected(sw.dataset.color);
        document.querySelectorAll("#modalColorSwatches .color-swatch").forEach(s => s.classList.toggle("selected", s.dataset.color === sw.dataset.color));
      };
    });
  };

  document.getElementById("addListBtn").onclick = () => {
    let selectedColor = LIST_COLORS[0];
    showModal("Новый список", `
      <label class="required">Название списка</label>
      <input type="text" id="modalListName" placeholder="Например, название проекта">
      <label>Краткое описание</label>
      <input type="text" id="modalListDesc" placeholder="Необязательно">
      <label>Цвет</label>
      ${colorPickerHtml(selectedColor)}
    `, async () => {
      const name = document.getElementById("modalListName").value.trim();
      if (!name) return false;
      const description = document.getElementById("modalListDesc").value.trim();
      await addKnownList(name, selectedColor, description);
      renderApp();
      return true;
    });
    wireColorPicker(() => selectedColor, (c) => { selectedColor = c; });
  };

  document.querySelectorAll("[data-edit-list]").forEach(btn => {
    btn.onclick = () => {
      const listId = btn.dataset.editList;
      const listName = btn.dataset.editListName;
      // Ищем сначала по id (обычный путь), потом подстраховкой по имени в
      // knownListsCache. Если списка нет вообще нигде в базе - это
      // "призрачный" список: он существует только как текст внутри старых
      // задач (заведённых ещё до перехода на текущую систему хранения) и
      // никогда не имел настоящей записи в базе списков. В этом случае
      // материализуем его прямо сейчас - создаём для него полноценную
      // запись, вместо того чтобы просто сообщать об ошибке.
      let list = (listId && knownListsCache.find(l => l.id === listId)) || knownListsCache.find(l => l.name === listName);
      if (!list) {
        list = { id: generateListId(), name: listName, color: LIST_COLORS[0], description: "", createdBy: currentUser.username, deleted: false };
        knownListsCache.push(list);
      }
      // Если список найден только по имени (id отсутствует - очень старая
      // запись) - "усыновляем" его прямо сейчас, присвоив настоящий id,
      // чтобы дальнейшее сохранение/переименование/удаление работало как
      // обычно, а не падало из-за пустого идентификатора документа.
      if (!list.id) {
        list.id = generateListId();
      }
      let selectedColor = list.color;
      const ownerOptions = usersDirectoryCache.map(u =>
        `<option value="${u.username}" ${u.username===(list.createdBy||currentUser.username)?'selected':''}>${u.fullName || u.username}</option>`
      ).join("");
      showModal("Изменить список", `
        <label class="required">Название</label>
        <input type="text" id="modalListName" value="${list.name}">
        <div class="hint">Названия списков теперь могут повторяться — не страшно, если у вас и коллеги будут списки с одинаковым именем.</div>
        <label>Краткое описание</label>
        <input type="text" id="modalListDesc" value="${list.description||''}">
        <label>Владелец списка</label>
        <select id="modalListOwner">${ownerOptions}</select>
        <div class="hint">У старых списков владелец не был указан — выберите здесь, чтобы список верно попадал в «Мои списки»/«Назначенные».</div>
        <label>Цвет</label>
        ${colorPickerHtml(selectedColor)}
        <div style="margin-top:20px;padding-top:14px;border-top:1px solid var(--border)">
          <button type="button" class="btn-danger-text" id="modalDeleteListBtn">Удалить список</button>
        </div>
      `, async () => {
        const newName = document.getElementById("modalListName").value.trim();
        if (!newName) return false;
        const description = document.getElementById("modalListDesc").value.trim();
        const createdBy = document.getElementById("modalListOwner").value;
        if (newName !== list.name) {
          await renameKnownList(list.id, newName); // теперь всегда успешно - дубликаты имён разрешены
        }
        await updateKnownList(list.id, { color: selectedColor, description, createdBy });
        renderApp();
        return true;
      });
      wireColorPicker(() => selectedColor, (c) => { selectedColor = c; });
      document.getElementById("modalDeleteListBtn").onclick = async () => {
        if (!confirm(`Удалить список «${list.name}»? Задачи внутри него останутся в базе. Список можно будет восстановить в разделе «Настройки».`)) return;
        await softDeleteKnownList(list.id);
        closeModal();
        renderApp();
      };
    };
  });

  // (обработчик для dashboardShowAllCheck убран вместе с самим чекбоксом)
  document.getElementById("toggleArchiveBtn").onclick = () => { dashboardShowArchive = !dashboardShowArchive; renderApp(); };
  const toggleHiddenBtn = document.getElementById("toggleHiddenBtn");
  if (toggleHiddenBtn) toggleHiddenBtn.onclick = () => { dashboardShowHiddenTasks = !dashboardShowHiddenTasks; renderApp(); };
  document.querySelectorAll("[data-archive-filter]").forEach(btn => {
    btn.onclick = () => { dashboardArchiveFilter = btn.dataset.archiveFilter; renderApp(); };
  });
  const exportReportBtn = document.getElementById("exportReportBtn");
  if (exportReportBtn) exportReportBtn.onclick = handleExportTasksReport;
  const periodFromEl = document.getElementById("reportPeriodFrom");
  if (periodFromEl) periodFromEl.onchange = () => { reportPeriodFromValue = periodFromEl.value; };
  const periodToEl = document.getElementById("reportPeriodTo");
  if (periodToEl) periodToEl.onchange = () => { reportPeriodToValue = periodToEl.value; };
  const includeCalendarEl = document.getElementById("reportIncludeCalendar");
  if (includeCalendarEl) includeCalendarEl.onchange = () => { reportIncludeCalendarValue = includeCalendarEl.checked; };

  // --- Календарь ---
  const calPrevBtn = document.getElementById("calPrevMonth");
  if (calPrevBtn) calPrevBtn.onclick = () => {
    calendarViewMonth--;
    if (calendarViewMonth < 0) { calendarViewMonth = 11; calendarViewYear--; }
    renderApp();
  };
  const calNextBtn = document.getElementById("calNextMonth");
  if (calNextBtn) calNextBtn.onclick = () => {
    calendarViewMonth++;
    if (calendarViewMonth > 11) { calendarViewMonth = 0; calendarViewYear++; }
    renderApp();
  };
  document.querySelectorAll("[data-cal-day]").forEach(cell => {
    cell.onclick = () => { calendarSelectedDay = cell.dataset.calDay; renderApp(); };
  });
  document.querySelectorAll("[data-cal-jump-to-day]").forEach(row => {
    row.onclick = () => {
      const iso = row.dataset.calJumpToDay;
      calendarSelectedDay = iso;
      calendarViewYear = parseInt(iso.slice(0, 4));
      calendarViewMonth = parseInt(iso.slice(5, 7)) - 1;
      renderApp();
    };
  });

  const openEventModal = (ev) => {
    let selectedColor = ev.color || LIST_COLORS[0];
    showModal(ev.id ? "Изменить событие" : "Новое событие", calendarEventFormModalHtml(ev), async () => {
      const title = document.getElementById("evTitle").value.trim();
      const date = document.getElementById("evDate").value;
      if (!title || !date) return false;
      const time = document.getElementById("evTime").value;
      const place = document.getElementById("evPlace").value.trim();
      const reminderMinutesRaw = document.getElementById("evReminder").value;
      const reminderMinutes = reminderMinutesRaw ? parseInt(reminderMinutesRaw) : null;
      const projectListName = document.getElementById("evProject").value;
      const visibility = document.getElementById("evVisibility").value;
      const sharedWith = visibility === "shared" ? [...document.querySelectorAll("#evSharedWith option:checked")].map(o => o.value) : [];
      const syncCheckbox = document.getElementById("evSyncIcloud"); // существует только у админа
      const syncIcloud = syncCheckbox ? syncCheckbox.checked : false;
      const data = { title, date, time, place, projectListName, visibility, sharedWith, color: selectedColor, reminderMinutes, reminderNotified: false };

      if (currentUser.role === "admin") {
        if (syncIcloud) {
          try {
            const res = await fetch(`${window.location.origin}/.netlify/functions/write-icloud-calendar`, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ action: "create", uid: ev.icloudUid, title, date, time, place }),
            });
            const json = await res.json();
            if (json.success) data.icloudUid = json.uid;
          } catch (e) { /* тихо игнорируем - основное событие в WorkSpace всё равно сохранится */ }
        } else if (ev.icloudUid) {
          // Синхронизацию выключили для уже привязанного события - удаляем из iCloud, оставляем в WorkSpace.
          try {
            await fetch(`${window.location.origin}/.netlify/functions/write-icloud-calendar`, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ action: "delete", uid: ev.icloudUid }),
            });
          } catch (e) {}
          data.icloudUid = null;
        }
      }

      if (ev.id) await updateCalendarEvent(ev.id, data);
      else await addCalendarEvent(data);
      calendarSelectedDay = date;

      // Не-админы не получают автоматическую синхронизацию с iCloud -
      // вместо этого сразу после сохранения предлагаем скачать .ics файл
      // события, который можно вручную добавить в любой свой календарь.
      if (currentUser.role !== "admin" && !ev.id) {
        if (confirm(`Событие «${title}» сохранено. Скачать файл для добавления в ваш календарь на телефоне?`)) {
          downloadEventAsIcs({ title, date, time, place });
        }
      }

      renderApp();
      return true;
    });
    document.querySelectorAll("#evColorSwatches .color-swatch").forEach(sw => {
      sw.onclick = () => {
        selectedColor = sw.dataset.color;
        document.querySelectorAll("#evColorSwatches .color-swatch").forEach(s => s.classList.toggle("selected", s === sw));
      };
    });
    const visEl = document.getElementById("evVisibility");
    visEl.onchange = () => { document.getElementById("evSharedWithBlock").style.display = visEl.value === "shared" ? "block" : "none"; };
    const delBtn = document.getElementById("modalDeleteEventBtn");
    if (delBtn) delBtn.onclick = async () => {
      if (!confirm("Удалить это событие?")) return;
      if (ev.icloudUid) {
        try {
          await fetch(`${window.location.origin}/.netlify/functions/write-icloud-calendar`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ action: "delete", uid: ev.icloudUid }),
          });
        } catch (e) {}
      }
      await deleteCalendarEvent(ev.id);
      closeModal();
      renderApp();
    };
  };

  document.querySelectorAll("[data-cal-add-event]").forEach(btn => {
    btn.onclick = () => openEventModal({ date: btn.dataset.calAddEvent });
  });
  document.querySelectorAll("[data-cal-edit-event]").forEach(btn => {
    btn.onclick = () => {
      const ev = calendarEventsCache.find(e => e.id === btn.dataset.calEditEvent);
      if (ev) openEventModal(ev);
    };
  });

  // Общая логика чтения полей "Тип задачи" из формы - одна и та же и при
  // создании, и при редактировании задачи.
  function readTaskTypeFieldsFromModal() {
    const taskType = document.getElementById("modalTaskType").value;
    if (taskType === "personal") {
      return { taskType, assignee: currentUser.username, assignees: [] };
    }
    if (taskType === "shared") {
      const others = [...document.querySelectorAll("#modalTaskShared option:checked")].map(o => o.value);
      return { taskType, assignee: currentUser.username, assignees: [currentUser.username, ...others] };
    }
    return { taskType: "assigned", assignee: document.getElementById("modalTaskAssignee").value || currentUser.username, assignees: [] };
  }
  function wireTaskTypeToggle() {
    const typeEl = document.getElementById("modalTaskType");
    if (!typeEl) return;
    typeEl.onchange = () => {
      document.getElementById("modalTaskAssigneeBlock").style.display = typeEl.value === "assigned" ? "block" : "none";
      document.getElementById("modalTaskSharedBlock").style.display = typeEl.value === "shared" ? "block" : "none";
    };
  }

  document.querySelectorAll("[data-add-task-to-list]").forEach(btn => {
    btn.onclick = () => {
      const listId = btn.dataset.addTaskToList || null;
      const listName = btn.dataset.addTaskToListName;
      showModal("Новая задача", taskFormModalHtml({}), async () => {
        const title = document.getElementById("modalTaskTitle").value.trim();
        if (!title) return false;
        const description = document.getElementById("modalTaskDesc").value.trim();
        const { taskType, assignee, assignees } = readTaskTypeFieldsFromModal();
        const dueDate = document.getElementById("modalTaskDueDate").value;
        const status = document.getElementById("modalTaskStatus").value;
        const today = document.getElementById("modalTaskToday").checked;
        const hidden = document.getElementById("modalTaskHidden").checked;
        const id = "t_" + Date.now();
        const task = { id, list: listName, listId, title, description, taskType, assignee, assignees, assignedBy: currentUser.username, status, dueDate, today, hidden, completedAt: status === "Готово" ? todayISO() : null };
        tasksCache.push(task);
        renderApp();
        const { id: _drop, ...taskData } = task;
        await fbDb.collection("tasks").doc(id).set(taskData);
        return true;
      });
      wireTaskTypeToggle();
    };
  });

  document.querySelectorAll("[data-edit-task]").forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.editTask;
      const task = tasksCache.find(t => t.id === id);
      if (!task) return;
      showModal("Изменить задачу", taskFormModalHtml(task), async () => {
        const title = document.getElementById("modalTaskTitle").value.trim();
        if (!title) return false;
        task.title = title;
        task.description = document.getElementById("modalTaskDesc").value.trim();
        const { taskType, assignee, assignees } = readTaskTypeFieldsFromModal();
        task.taskType = taskType;
        task.assignee = assignee;
        task.assignees = assignees;
        task.dueDate = document.getElementById("modalTaskDueDate").value;
        const newStatus = document.getElementById("modalTaskStatus").value;
        if (newStatus === "Готово" && task.status !== "Готово") task.completedAt = todayISO();
        else if (newStatus !== "Готово") task.completedAt = null;
        task.status = newStatus;
        task.today = document.getElementById("modalTaskToday").checked;
        task.hidden = document.getElementById("modalTaskHidden").checked;
        renderApp();
        const { id: _drop, ...taskData } = task;
        await fbDb.collection("tasks").doc(id).set(taskData);
        return true;
      });
      wireTaskTypeToggle();
    };
  });

  document.querySelectorAll("[data-cycle-status]").forEach(el => {
    el.onclick = async () => {
      const id = el.dataset.cycleStatus;
      const task = tasksCache.find(t => t.id === id);
      if (!task) return;
      task.status = nextStatus(task.status);
      // Фиксируем дату выполнения при переходе в "Готово" - нужна для
      // отчёта по выполненным задачам за период. Если статус меняют
      // обратно (например, по ошибке отметили готовым) - дату убираем.
      const update = { status: task.status };
      if (task.status === "Готово") { task.completedAt = todayISO(); update.completedAt = task.completedAt; }
      else if (task.completedAt) { task.completedAt = null; update.completedAt = null; }
      renderApp();
      await fbDb.collection("tasks").doc(id).update(update);
    };
  });

  document.querySelectorAll("[data-toggle-today]").forEach(el => {
    el.onclick = async () => {
      const id = el.dataset.toggleToday;
      const task = tasksCache.find(t => t.id === id);
      if (!task) return;
      task.today = !task.today;
      renderApp();
      await fbDb.collection("tasks").doc(id).update({ today: task.today });
    };
  });

  document.querySelectorAll("[data-delete-task]").forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.deleteTask;
      if (!confirm("Удалить задачу?")) return;
      tasksCache = tasksCache.filter(t => t.id !== id);
      renderApp();
      await fbDb.collection("tasks").doc(id).delete();
    };
  });
}

function renderApp() {
  const app = document.getElementById("app");
  if (currentPage === "dashboard") { app.innerHTML = renderDashboardPage(); attachDashboardHandlers(); return; }
  if (currentPage === "documents") { app.innerHTML = renderDocumentsPage(); attachDocumentsHandlers(); return; }
  if (currentPage === "settings") { app.innerHTML = renderSettings(); attachSettingsHandlers(); return; }
  if (currentPage === "smeta") { app.innerHTML = renderSmetaPage(); attachSmetaHandlers(); return; }
  if (currentPage === "planning") { app.innerHTML = renderPlanningPage(); attachPlanningHandlers(); return; }
  if (currentStep === 0) app.innerHTML = renderStep1();
  else if (currentStep === 1) app.innerHTML = renderStep2();
  else if (currentStep === 2) app.innerHTML = renderStep3();
  else if (currentStep === 3) app.innerHTML = renderStep4();
  else if (currentStep === 4) app.innerHTML = renderStep5();
  attachHandlers();
}

function renderStep1() {
  const typeOptions = [
    { type: "services_200", variant: "ip", label: "Услуги — ИП" },
    { type: "services_200_specialists", variant: "ip", label: "Услуги — привлечение специалистов (ИП)" },
    { type: "services_200", variant: "ip_ads", label: "Услуги (реклама) — ИП" },
    { type: "services_200", variant: "samozanyaty", label: "Услуги — Самозанятый" },
    { type: "supply_300", variant: "ip", label: "Поставка — ИП" },
    { type: "supply_300", variant: "ooo", label: "Поставка — ООО" },
    { type: "rental_400", variant: "ip", label: "Аренда — ИП" },
  ];
  const grantWarning = state.grantId && GRANTS[state.grantId]._warning ? `<div class="warning-box">⚠️ ${GRANTS[state.grantId]._warning}</div>` : "";
  const draftNotice = state.contractType ? `<div class="hint" style="margin-bottom:14px">Черновик заполнен ранее и сохранён автоматически. <span style="text-decoration:underline;cursor:pointer;color:var(--accent)" id="resetDraftLink">Начать новый договор с чистого листа</span></div>` : "";
  return `<div class="card"><h2>Шаг 1 — Тип договора и грант</h2>
  ${draftNotice}
  <label class="required">Тип договора и контрагента</label>
  <div class="radio-group" id="typeOptions">${typeOptions.map(o => `<div class="radio-option ${state.contractType===o.type && state.contractorVariant===o.variant?'selected':''}" data-type="${o.type}" data-variant="${o.variant}">${o.label}</div>`).join("")}</div>
  <label class="required">Грант</label>
  <select id="grantSelect">${Object.keys(GRANTS).filter(subsidyAllowedForUser).map(id => `<option value="${id}" ${state.grantId===id?'selected':''}>${GRANTS[id].label}</option>`).join("")}</select>
  ${Object.keys(GRANTS).filter(subsidyAllowedForUser).length === 0 ? '<div class="warning-box">⚠️ У вас нет доступа ни к одному гранту.</div>' : ''}
  <div class="hint">Заказчик подставляется автоматически в зависимости от выбранного гранта. Реквизиты заказчиков можно посмотреть и изменить в разделе «⚙ Настройки» вверху страницы.</div>
  ${grantWarning}</div>
  <div class="nav-buttons"><div></div><button class="btn btn-primary" id="nextBtn" ${!state.contractType?'disabled':''}>Далее →</button></div>`;
}

function renderStep2() {
  const variant = state.contractorVariant;
  const fields = CONTRACTOR_FIELD_SETS[variant] || [];
  const registryFiltered = CONTRACTORS_REGISTRY.filter(c => c.type === variant);
  const registryHtml = registryFiltered.length ? `<h3>Выбрать из справочника</h3>${registryFiltered.map(c => `<div class="contractor-card ${state.selectedContractorId===c.id?'selected':''}" data-contractor-id="${c.id}">${c.short_name}</div>`).join("")}<div class="hint">Или заполните поля вручную ниже.</div>` : `<div class="hint">Справочник для этого типа пуст — заполните поля вручную.</div>`;
  const fieldsHtml = fields.map(f => `<label class="required">${f.label}</label><input type="text" required data-contractor-field="${f.name}" value="${state.contractor[f.name] || ''}">`).join("");
  return `<div class="card"><h2>Шаг 2 — Стороны (${CONTRACT_CONFIGS[configKey()].roleLabels.contractor})</h2>
  ${registryHtml}<h3>Реквизиты</h3>${fieldsHtml}
  <div class="checkbox-row"><input type="checkbox" id="notEmployeeCheck" ${state.notEmployeeConfirmed?'checked':''}><label for="notEmployeeCheck" class="required">Подтверждаю: контрагент не является сотрудником/студентом СПбГУПТД</label></div>
  <button class="btn btn-secondary btn-small" style="margin-top:20px" id="addContractorBtn">+ Добавить исполнителя в справочник</button>
  </div><div class="nav-buttons"><button class="btn btn-secondary" id="backBtn">← Назад</button><button class="btn btn-primary" id="nextBtn">Далее →</button></div>`;
}

function renderStep3() {
  const config = currentConfig();
  const bodyHtml = config.bodyFields.map(f => {
    let label = BODY_FIELD_LABELS[f] || f;
    let hint = "";
    // Оба типа "Услуги" теперь имеют фразу "услуги по" жёстко вписанной в
    // текст договора и техзадание - пользователь вводит только окончание
    // (напр. "привлечению специалистов" или "разработке дизайн-макета").
    if (f === "subject_description" && (state.contractType === "services_200" || state.contractType === "services_200_specialists")) {
      hint = `<div class="hint">Подсказка: полная фраза в договоре будет «Услуг по <b>[ваш текст]</b>» — вписывайте только окончание, без самого «Услуг по».</div>`;
    }
    return `<label class="required">${label}</label>${renderBodyFieldInput(f)}${hint}`;
  }).join("");
  const vatOptions = [
    ["none", "Без НДС (НДС не облагается)"],
    ["included", "НДС включён в сумму договора"],
  ];
  return `<div class="card"><h2>Шаг 3 — Тело договора</h2>
  <div class="row2"><div><label class="required">Номер договора</label><input type="text" required id="contractNumber" value="${state.contractNumber}" placeholder="напр. РОСМОЛ-08-2026"></div><div><label class="required">Дата договора</label><input type="text" required id="contractDate" value="${state.contractDate}" placeholder="напр. 10.08.2026"></div></div>
  <label>Пункт Положения о закупке</label><input type="text" id="polozhenieClause" value="${state.polozhenieClause}">
  <h3>Предмет и сроки</h3>${bodyHtml}
  <h3>Оплата</h3>
  <label>НДС</label>
  <select id="vatMode">${vatOptions.map(([v,l]) => `<option value="${v}" ${state.vatMode===v?'selected':''}>${l}</option>`).join("")}</select>
  <div id="vatRateBlock" style="${state.vatMode==='included'?'':'display:none'}">
    <label>Ставка НДС, %</label>
    <input type="number" id="vatRate" value="${state.vatRate||20}" style="max-width:140px">
    <div class="hint" id="vatCalcPreview"></div>
  </div>
  <div class="hint">Сумма договора считается автоматически из строк таблиц на следующем шаге.</div>
  </div><div class="nav-buttons"><button class="btn btn-secondary" id="backBtn">← Назад</button><button class="btn btn-primary" id="nextBtn">Далее →</button></div>`;
}

function renderStep4() {
  ensureAppendices();
  const config = currentConfig();
  const isRental = state.contractType === "rental_400";
  const canAddMore = config.trueLoopAppendices || state.appendices.length < config.appendixCount;
  const canRemove = state.appendices.length > 1;
  const appendixBlocks = state.appendices.map((appendix, aIdx) => {
    const fieldsHtml = config.appendixFields.map(f => `<label class="required">${APPENDIX_FIELD_LABELS[f]||f}</label><input type="text" required data-appendix-idx="${aIdx}" data-appendix-field="${f}" value="${appendix.values[f]||''}">`).join("");
    const rowsHtml = appendix.rows.map((row, rIdx) => `<tr>${config.rowFields.map(f => {
      const isTotalField = f.name === config.calcFields.total;
      const isCalcInput = f.name === config.calcFields.qty || f.name === config.calcFields.price;
      const calcAttr = isCalcInput ? `data-calc-row="${aIdx}"` : "";
      const requiredAttr = isCalcInput ? "required" : "";
      const readonly = isTotalField ? "readonly style=\"background:#f5f5f5;color:#555\"" : "";
      return `<td><input type="text" ${readonly} ${requiredAttr} data-a="${aIdx}" data-r="${rIdx}" data-f="${f.name}" ${calcAttr} value="${row[f.name]||''}"></td>`;
    }).join("")}<td><button class="btn-danger-text" data-remove-row="${aIdx}:${rIdx}">✕</button></td></tr>`).join("");
    const totalLabel = isRental ? "" : `<label>Итог приложения, руб. <small class="gray">(считается автоматически)</small></label><div id="appendixTotalDisplay-${aIdx}" style="font-weight:600;font-size:15px;padding:6px 0">${formatRuNumber(computeAppendixTotalRub(appendix, config))} руб.</div>`;
    const removeBtn = canRemove ? `<button class="btn-danger-text" data-remove-appendix="${aIdx}" style="float:right">✕ Удалить приложение</button>` : "";
    const smetaPickerBtn = smetaItemsAvailable() ? `<button class="btn btn-secondary btn-small" style="margin-left:8px" data-pick-from-smeta="${aIdx}">Добавить из сметы</button>` : "";
    return `<div class="appendix-block"><h4>Приложение ${aIdx+1}${removeBtn}</h4>${fieldsHtml}<table class="row-table"><thead><tr>${config.rowFields.map(f => f.editableLabel
      ? `<th><input type="text" data-field-label="${f.name}" value="${(state.customFieldLabels[f.name]||f.label).replace(/"/g,'&quot;')}" style="font-weight:600;padding:2px 4px;border:1px solid var(--border-strong)"></th>`
      : `<th>${f.label}</th>`
    ).join("")}<th></th></tr></thead><tbody>${rowsHtml}</tbody></table><button class="btn btn-secondary" style="margin-top:8px;font-size:12px;padding:6px 12px" data-add-row="${aIdx}">+ Добавить строку</button>${smetaPickerBtn}${totalLabel}</div>`;
  }).join("");

  const addAppendixBtn = canAddMore ? `<button class="btn btn-secondary" style="margin-bottom:16px" id="addAppendixBtn">+ Добавить приложение</button>` : "";

  const rentalBlock = isRental ? `<div class="card"><h3>Итоги по аренде</h3>
    <label class="required">Количество дней аренды</label>
    <input type="number" id="rentalDays" value="${state.rental?.days || 1}" min="1" style="max-width:140px">
    <div class="row2" style="margin-top:14px">
      <div><label>Стоимость за 1 сутки <small class="gray">(авто)</small></label><div id="rentalDailyDisplay" style="font-weight:600;padding:6px 0">${formatRuNumber(computeRentalDailyTotalRub(state, config))} руб.</div></div>
      <div><label>ИТОГО за весь срок <small class="gray">(авто)</small></label><div id="rentalTotalDisplay" style="font-weight:600;padding:6px 0">${formatRuNumber(computeContractTotalRub(state, config))} руб.</div></div>
    </div></div>` : "";

  const appendixCountLabel = config.trueLoopAppendices ? `${state.appendices.length} (без ограничения)` : `${state.appendices.length} из ${config.appendixCount}`;
  return `<div class="card"><h2>Шаг 4 — Приложения (${appendixCountLabel})</h2><div class="hint">Сумма строки = количество × цена, считается автоматически. Просто впишите количество и цену.</div>${appendixBlocks}${addAppendixBtn}</div>${rentalBlock}
  <div class="nav-buttons"><button class="btn btn-secondary" id="backBtn">← Назад</button><button class="btn btn-primary" id="nextBtn">Далее →</button></div>`;
}

function renderStep5() {
  const config = currentConfig();
  const grant = GRANTS[state.grantId];
  let payload = null, buildError = null;
  try { payload = buildPayload(state, config, grant); } catch (e) { buildError = e.message; }
  const rows = [["Тип договора",config.label],["Грант",grant.label],["Номер / дата",`${state.contractNumber} от ${state.contractDate}`],["Контрагент",state.contractor.contractor_full_name||"—"],["Сумма (авто)",formatRuNumber(computeContractTotalRub(state, config))+" руб."],["Приложений",`${state.appendices.length} (в договор попадёт именно столько)`]];
  return `<div class="card"><h2>Шаг 5 — Проверка и генерация</h2>
  <table class="review-table">${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table>
  ${buildError?`<div class="warning-box">⚠️ ${buildError}</div>`:""}
  <div style="margin-top:18px"><button class="btn btn-primary" id="generateBtn" ${buildError?'disabled':''}>Сгенерировать и скачать договор</button></div>
  <div id="resultBox"></div></div>
  <div class="nav-buttons"><button class="btn btn-secondary" id="backBtn">← Назад</button><div></div></div>`;
}

function attachHandlers() {
  const backBtn = document.getElementById("backBtn"); if (backBtn) backBtn.onclick = () => goToStep(currentStep-1);
  const nextBtn = document.getElementById("nextBtn"); if (nextBtn) nextBtn.onclick = () => { if (!validateCurrentStep()) return; saveCurrentStep(); goToStep(currentStep+1); };
  if (currentStep === 0) {
    document.querySelectorAll("#typeOptions .radio-option").forEach(el => { el.onclick = () => { state.contractType = el.dataset.type; state.contractorVariant = el.dataset.variant; state.appendices = []; renderApp(); }; });
    document.getElementById("grantSelect").onchange = (e) => { state.grantId = e.target.value; };
    const resetLink = document.getElementById("resetDraftLink");
    if (resetLink) resetLink.onclick = () => {
      if (confirm("Стереть текущий черновик договора и начать заново?")) { resetDraft(); renderApp(); }
    };
  }
  if (currentStep === 1) {
    document.querySelectorAll(".contractor-card").forEach(el => { el.onclick = () => { const c = CONTRACTORS_REGISTRY.find(x => x.id === el.dataset.contractorId); state.selectedContractorId = c.id; state.contractor = { ...c }; delete state.contractor.id; delete state.contractor.type; delete state.contractor.short_name; renderApp(); }; });
    const addContractorBtn = document.getElementById("addContractorBtn");
    if (addContractorBtn) addContractorBtn.onclick = () => {
      const variant = state.contractorVariant;
      const fields = CONTRACTOR_FIELD_SETS[variant] || [];
      const extraFieldsHtml = fields.map(f => `<label class="required">${f.label}</label><input type="text" id="newC_${f.name}">`).join("");
      showModal("Новый исполнитель в справочнике", `
        <label class="required">Короткое имя для списка</label>
        <input type="text" id="newC_short_name" placeholder="напр. ИП Иванов И.И.">
        <label class="required">ФИО/название для подписи в документах</label>
        <input type="text" id="newC_document_signature_name" placeholder="напр. ИП Иванов Иван Иванович">
        <h3>Реквизиты</h3>
        ${extraFieldsHtml}
      `, async () => {
        const shortName = document.getElementById("newC_short_name").value.trim();
        const docSigName = document.getElementById("newC_document_signature_name").value.trim();
        if (!shortName) return false;
        const contractor = { id: "c_" + Date.now(), type: variant, short_name: shortName, document_signature_name: docSigName };
        fields.forEach(f => { contractor[f.name] = document.getElementById(`newC_${f.name}`).value.trim(); });
        await addContractorToRegistry(contractor);
        renderApp();
        return true;
      });
    };
  }
  if (currentStep === 2) {
    const vatModeEl = document.getElementById("vatMode");
    const vatRateEl = document.getElementById("vatRate");
    const updateVatPreview = () => {
      const previewEl = document.getElementById("vatCalcPreview");
      if (!previewEl) return;
      const config = currentConfig();
      const total = computeContractTotalRub(state, config);
      const rate = parseFloat(vatRateEl ? vatRateEl.value : 20) || 0;
      const vatAmount = total - total / (1 + rate / 100);
      previewEl.textContent = total > 0
        ? `При сумме договора ${formatRuNumber(total)} руб.: НДС ${rate}% составит ${formatRuNumber(vatAmount)} руб. (сумма уже включает НДС, отдельно сверху не добавляется).`
        : "Сумма договора появится после заполнения приложений на следующем шаге.";
    };
    if (vatModeEl) vatModeEl.onchange = () => {
      const block = document.getElementById("vatRateBlock");
      if (block) block.style.display = vatModeEl.value === "included" ? "" : "none";
      updateVatPreview();
    };
    if (vatRateEl) vatRateEl.oninput = updateVatPreview;
    updateVatPreview();
  }
  if (currentStep === 3) {
    document.querySelectorAll("[data-add-row]").forEach(btn => { btn.onclick = () => { const aIdx = parseInt(btn.dataset.addRow); state.appendices[aIdx].rows.push(emptyRow(currentConfig())); renderApp(); }; });
    document.querySelectorAll("[data-remove-row]").forEach(btn => { btn.onclick = () => { const [aIdx, rIdx] = btn.dataset.removeRow.split(":").map(Number); if (state.appendices[aIdx].rows.length > 1) state.appendices[aIdx].rows.splice(rIdx, 1); renderApp(); }; });
    const addAppendixBtn = document.getElementById("addAppendixBtn");
    if (addAppendixBtn) addAppendixBtn.onclick = () => {
      const config = currentConfig();
      state.appendices.push({ values: {}, totalRub: 0, rows: [emptyRow(config)] });
      renderApp();
    };
    document.querySelectorAll("[data-remove-appendix]").forEach(btn => {
      btn.onclick = () => {
        const aIdx = parseInt(btn.dataset.removeAppendix);
        if (state.appendices.length > 1 && confirm("Удалить это приложение вместе со всеми его строками?")) {
          state.appendices.splice(aIdx, 1);
          renderApp();
        }
      };
    });
    document.querySelectorAll("[data-calc-row]").forEach(inp => { inp.oninput = () => recalcRowLive(parseInt(inp.dataset.calcRow)); });
    document.querySelectorAll("[data-field-label]").forEach(inp => { inp.onchange = () => { state.customFieldLabels[inp.dataset.fieldLabel] = inp.value; }; });
    const rentalDaysEl = document.getElementById("rentalDays");
    if (rentalDaysEl) rentalDaysEl.oninput = recalcRentalLive;
    document.querySelectorAll("[data-pick-from-smeta]").forEach(btn => {
      btn.onclick = () => openSmetaPickerModal(parseInt(btn.dataset.pickFromSmeta));
    });
  }
  if (currentStep === 4) { const genBtn = document.getElementById("generateBtn"); if (genBtn) genBtn.onclick = handleGenerate; }
}

function saveCurrentStep() {
  if (currentStep === 1) {
    document.querySelectorAll("[data-contractor-field]").forEach(inp => { state.contractor[inp.dataset.contractorField] = inp.value; });
    state.notEmployeeConfirmed = document.getElementById("notEmployeeCheck").checked;
  }
  if (currentStep === 2) {
    state.contractNumber = document.getElementById("contractNumber").value;
    state.contractDate = document.getElementById("contractDate").value;
    state.polozhenieClause = document.getElementById("polozhenieClause").value;
    document.querySelectorAll("[data-body-field]").forEach(inp => { state.bodyValues[inp.dataset.bodyField] = inp.value; });
    state.vatMode = document.getElementById("vatMode").value;
    const vatRateEl = document.getElementById("vatRate");
    if (vatRateEl) state.vatRate = parseFloat(vatRateEl.value) || 20;
  }
  if (currentStep === 3) {
    document.querySelectorAll("[data-appendix-idx]").forEach(inp => { const aIdx = parseInt(inp.dataset.appendixIdx); state.appendices[aIdx].values[inp.dataset.appendixField] = inp.value; });
    document.querySelectorAll("[data-a]").forEach(inp => { const a = parseInt(inp.dataset.a), r = parseInt(inp.dataset.r), f = inp.dataset.f; state.appendices[a].rows[r][f] = inp.value; });
    if (state.contractType === "rental_400") {
      const daysEl = document.getElementById("rentalDays");
      state.rental = { startDate: state.bodyValues.rental_start_date, endDate: state.bodyValues.rental_end_date, days: daysEl ? (parseInt(daysEl.value) || 1) : 1 };
    }
  }
}

async function handleGenerate() {
  const siteUrl = window.location.origin;
  const resultBox = document.getElementById("resultBox");
  const btn = document.getElementById("generateBtn");
  const config = currentConfig(); const grant = GRANTS[state.grantId];
  let payload;
  try { payload = buildPayload(state, config, grant); } catch (e) { resultBox.style.display = "block"; resultBox.className = "error"; resultBox.textContent = "❌ " + e.message; return; }
  btn.disabled = true; btn.textContent = "Генерирую..."; resultBox.style.display = "none";
  try {
    const res = await fetch(`${siteUrl}/.netlify/functions/generate-contract`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    resultBox.style.display = "block";
    if (res.ok) {
      const blob = await res.blob(); const url = window.URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href = url; a.download = payload.fileName;
      document.body.appendChild(a); a.click(); a.remove(); window.URL.revokeObjectURL(url);
      resultBox.className = "success";
      resultBox.textContent = "✅ Готово! Файл " + payload.fileName + " должен был начать скачиваться.\n\nПроверьте папку «Загрузки» и вручную перенесите файл в нужную папку на Google Диске.";
      clearDraft();
    } else {
      const text = await res.text();
      resultBox.className = "error"; resultBox.textContent = "❌ ОШИБКА\n\nHTTP статус: " + res.status + "\n\n" + text;
    }
  } catch (err) {
    resultBox.style.display = "block"; resultBox.className = "error"; resultBox.textContent = "❌ Не удалось отправить запрос.\n\n" + err.message;
  } finally { btn.disabled = false; btn.textContent = "Сгенерировать и скачать договор"; }
}

# netlify.toml
#
# КРИТИЧНО: без этой настройки Netlify не включает папку templates/ в
# пакет серверных функций - функция генерации договоров ищет файлы
# шаблонов по пути /var/task/templates/... и не находит их, хотя сами
# файлы лежат в репозитории. Строка included_files ниже явно говорит
# Netlify: "возьми все файлы из templates/ и положи их рядом с функциями
# при сборке".
#
# Разместить этот файл в КОРНЕ репозитория (там же, где папки netlify/,
# templates/, google_integration/). Если у вас уже есть файл netlify.toml -
# не заменяйте его целиком, а слейте блоки [functions] и [functions."..."]
# ниже с тем, что там уже есть.

[functions]
  included_files = ["templates/**"]

# Функция по расписанию (Scheduled Function) - Netlify запускает её сама
# каждые 5 минут, без участия браузера, чтобы проверять напоминания о
# событиях и слать push-уведомления даже когда WorkSpace нигде не открыт.
[functions."check-reminders"]
  schedule = "*/5 * * * *"
